# ============================================
# Docker Compose - Local Development
# ============================================
# Usage: docker-compose up -d
# This runs PostgreSQL + Redis + the app locally

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: llama-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llama_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching & WebSocket pub/sub
  redis:
    image: redis:7-alpine
    container_name: llama-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Llama Agent API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8765:8765"  # WebSocket
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llama_agent
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  # Streamlit Web UI
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama-agent-web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llama_agent
      - API_URL=http://api:8000
    depends_on:
      - api
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
  redis_data:
