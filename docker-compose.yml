# ============================================
# Docker Compose - Full Stack
# ============================================
# Usage:
#   docker-compose up -d              (start everything)
#   docker-compose up -d api web      (start API + UI only)
#   docker-compose logs -f api        (watch API logs)
#   docker-compose down               (stop everything)

version: '3.8'

services:
  # =============================================
  # PostgreSQL Database
  # =============================================
  postgres:
    image: postgres:15-alpine
    container_name: llama-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: llama_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # Redis (Caching + WebSocket pub/sub)
  # =============================================
  redis:
    image: redis:7-alpine
    container_name: llama-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # REST API (FastAPI + Swagger UI)
  # =============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama-agent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8765:8765"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llama_agent
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================
  # Streamlit Web UI
  # =============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama-agent-web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/llama_agent
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - api
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0

  # =============================================
  # MCP Agent Server (5 specialized agents)
  # =============================================
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llama-agent-mcp
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: python mcp_agents_server.py
    # MCP uses stdio transport (no exposed port needed)
    # The Streamlit app connects to this via subprocess

volumes:
  postgres_data:
  redis_data:
