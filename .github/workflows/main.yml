name: "Full Stack CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ravneet231/llama-agent

jobs:
  # ============================================================
  # JOB 1: MATRIX TESTING
  # ============================================================
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv PyPDF2 python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest pytest-cov sqlalchemy psycopg2-binary redis

      - name: "Run tests with coverage"
        run: |
          pytest tests/ -v -m "not mcp" --tb=short || true
          pytest test_advanced_rag.py -v --tb=short

  # ============================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "Scan for vulnerabilities"
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt --progress-spinner off || echo "Some vulnerabilities found"
          bandit -r . -f json -o bandit-report.json --exit-zero || true

      - name: "Upload security report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  # ============================================================
  # JOB 3: CODE QUALITY
  # ============================================================
  lint:
    name: "Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "Install linting tools"
        run: pip install flake8

      - name: "Check for critical errors"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

  # ============================================================
  # JOB 4: INTEGRATION TEST
  # ============================================================
  integration:
    name: "Integration Test"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "Install dependencies"
        run: |
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv PyPDF2 python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest sqlalchemy psycopg2-binary redis

      - name: "Test all modules import"
        run: |
          python -c "from modules.memory import ConversationMemory, FactMemory; print('Memory OK')"
          python -c "from modules.rag import SimpleRAG; print('RAG OK')"
          python -c "from modules.monitoring import AgentLogger, PerformanceMonitor; print('Monitoring OK')"
          python -c "from modules.vector_store import get_vector_store; print('Vector Store OK')"
          python -c "from modules.advanced_rag import ReRanker, SubQuestionEngine, RouterQueryEngine, AdvancedRAG; print('Advanced RAG OK')"
          python -c "from modules.security import FileValidator; print('Security OK')"
          python -c "from modules.cache import MemoryCache; print('Cache OK')"

      - name: "Test integration"
        env:
          GROQ_API_KEY: test_key_for_ci
        run: |
          python -c "
          from modules.memory import ConversationMemory, FactMemory
          from modules.rag import SimpleRAG
          from modules.monitoring import AgentLogger, PerformanceMonitor
          from modules.vector_store import get_vector_store

          # Test memory modules
          mem = ConversationMemory()
          mem.add_message('user', 'test')

          facts = FactMemory()
          facts.remember('test', 'value')

          # Test RAG
          rag = SimpleRAG()
          rag.add_text('test content')

          # Test monitoring
          monitor = PerformanceMonitor()
          monitor.track_request()

          # Test vector store
          store = get_vector_store(persist_directory='data/test_ci_chromadb')
          import shutil, os
          if os.path.exists('data/test_ci_chromadb'):
              shutil.rmtree('data/test_ci_chromadb', ignore_errors=True)

          print('All integrations passed!')
          "

  # ============================================================
  # JOB 5: DOCKER BUILD
  # ============================================================
  docker:
    name: "Build Docker Image"
    needs: [test, security, lint, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to DockerHub"
        uses: docker/login-action@v3
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "Build Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  # ============================================================
  # JOB 6: DEPLOY STAGING (placeholder)
  # ============================================================
  deploy-staging:
    name: "Deploy to Staging"
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.your-agent.com

    steps:
      - name: "Deploy to Staging"
        run: |
          echo "Deploying to staging..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Staging deployment complete!"

  # ============================================================
  # JOB 7: NOTIFY
  # ============================================================
  notify:
    name: "Notifications"
    needs: [test, security, lint, integration]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: "Report status"
        run: |
          if [ "${{ needs.test.result }}" = "failure" ]; then
            echo "Tests failed!"
            exit 1
          elif [ "${{ needs.security.result }}" = "failure" ]; then
            echo "Security scan failed!"
            exit 1
          else
            echo "Pipeline completed: test=${{ needs.test.result }} security=${{ needs.security.result }} lint=${{ needs.lint.result }} integration=${{ needs.integration.result }}"
          fi
