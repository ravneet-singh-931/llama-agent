name: CI Pipeline

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ============ STEP 1: Check out your code ============
      - name: Checkout code
        uses: actions/checkout@v3

      # ============ STEP 2: Set up Python ============
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # ============ STEP 3: Install dependencies ============
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ============ STEP 4: Verify code syntax ============
      - name: Verify code syntax
        run: python -m py_compile llama_agent1.py

      # ============ STEP 5: Log in to Docker Hub ============
      # This uses a secret token (not your password) — safe!
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ============ STEP 6: Build & Push Docker image ============
      # This builds your image and uploads it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/llama-agent:latest
