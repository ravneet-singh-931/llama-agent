name: "\U0001F680 Full Stack CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ravneet231/llama-agent

jobs:
  # ============================================================
  # JOB 1: MATRIX TESTING
  # ============================================================
  test:
    name: "\U0001F9EA Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: "\U0001F4E6 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv PyPDF2 python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest pytest-cov sqlalchemy psycopg2-binary asyncpg redis

      - name: "\U0001F9EA Run tests with coverage"
        run: |
          pytest tests/ -v -m "not mcp" --tb=short || true
          python test_advanced_rag.py

      - name: "\U0001F4CA Upload coverage"
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================
  security:
    name: "\U0001F512 Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "\U0001F50D Scan for vulnerabilities"
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt --progress-spinner off || echo "Some vulnerabilities found"
          bandit -r . -f json -o bandit-report.json --exit-zero || true

      - name: "\U0001F4CB Upload security report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  # ============================================================
  # JOB 3: CODE QUALITY
  # ============================================================
  lint:
    name: "\U0001F9F9 Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "\U0001F4E6 Install linting tools"
        run: pip install flake8

      - name: "\U0001F50D Check for critical errors"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

  # ============================================================
  # JOB 4: INTEGRATION TEST
  # ============================================================
  integration:
    name: "\U0001F517 Integration Test"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "\U0001F4E6 Install dependencies"
        run: |
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv PyPDF2 python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest sqlalchemy psycopg2-binary asyncpg redis

      - name: "\U0001F517 Test all modules import"
        run: |
          python -c "from modules.memory import ConversationMemory, FactMemory; print('Memory OK')"
          python -c "from modules.rag import SimpleRAG; print('RAG OK')"
          python -c "from modules.monitoring import AgentLogger, PerformanceMonitor; print('Monitoring OK')"
          python -c "from modules.vector_store import get_vector_store; print('Vector Store OK')"
          python -c "from modules.advanced_rag import ReRanker, SubQuestionEngine, RouterQueryEngine, AdvancedRAG; print('Advanced RAG OK')"
          python -c "from modules.cache import InMemoryCache; print('Cache OK')"

      - name: "\U0001F517 Test integration"
        env:
          GROQ_API_KEY: test_key_for_ci
        run: |
          python -c "
          from modules.memory import ConversationMemory, FactMemory
          from modules.rag import SimpleRAG
          from modules.monitoring import AgentLogger, PerformanceMonitor
          from modules.vector_store import get_vector_store

          mem = ConversationMemory()
          mem.add_message('user', 'test')

          facts = FactMemory()
          facts.remember('test', 'value')

          rag = SimpleRAG()
          rag.add_text('test content')

          monitor = PerformanceMonitor()
          monitor.track_request()

          store = get_vector_store(persist_directory='data/test_ci_chromadb')
          import shutil, os
          if os.path.exists('data/test_ci_chromadb'):
              shutil.rmtree('data/test_ci_chromadb', ignore_errors=True)

          print('All integrations passed!')
          "

  # ============================================================
  # JOB 5: DOCKER BUILD
  # ============================================================
  docker:
    name: "\U0001F433 Build & Push Docker"
    needs: [test, security, lint, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F433 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "\U0001F510 Login to DockerHub"
        uses: docker/login-action@v3
        if: success()
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "\U0001F4BE Cache Docker layers"
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: "\U0001F3D7\uFE0F Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: "\U0001F504 Rotate cache"
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

  # ============================================================
  # JOB 6: DEPLOY STAGING
  # ============================================================
  deploy-staging:
    name: "\U0001F3AA Deploy to Staging"
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F680 Deploy to Staging"
        run: |
          echo "Deploying to staging..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Staging deployment complete!"

  # ============================================================
  # JOB 7: DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    name: "\U0001F3ED Deploy to Production"
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F680 Deploy to Production"
        run: |
          echo "Deploying to production..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Production deployment complete!"

  # ============================================================
  # JOB 8: NOTIFY
  # ============================================================
  notify:
    name: "\U0001F4E2 Notifications"
    needs: [test, security, lint, integration, docker, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: "\U0001F41B Create issue on failure"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline Failed: ${context.sha.slice(0,7)}`,
              body: `## Pipeline Failed!\n\n**Commit:** ${context.sha}\n**Author:** ${context.actor}\n\n[View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci-cd']
            })
