name: "\U0001F680 Full Stack CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ravneet231/llama-agent

jobs:
  # ============================================================
  # JOB 1: MATRIX TESTING
  # ============================================================
  test:
    name: "\U0001F9EA Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: "\U0001F4E6 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv pypdf python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest pytest-cov pytest-asyncio sqlalchemy psycopg2-binary asyncpg redis mcp prometheus-client fastmcp

      - name: "\U0001F9EA Run tests with coverage"
        run: |
          pytest tests/ -v -m "not mcp" --tb=short

      - name: "\U0001F4CA Upload coverage"
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================
  security:
    name: "\U0001F512 Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "\U0001F50D Scan for vulnerabilities"
        run: |
          pip install pip-audit bandit
          # Ignored CVEs are reviewed + documented:
          #  - PYSEC-2025-217, PYSEC-2026-2288/2289/2290: transformers (<5 pinned by
          #    llama-index-llms-openai-like; no 4.x fix exists upstream)
          #  - PYSEC-2026-311: chromadb (latest 1.5.9, no upstream fix yet)
          #  - PYSEC-2026-1325: ecdsa (latest 0.19.2, no upstream fix yet)
          # Re-evaluate on every dependency bump; new CVEs still fail the build.
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-1325
          # bandit: skip known non-issues (documented):
          #  B101 assert in tests (pytest standard), B105/B106/B107 hardcoded
          #  credentials in test fixtures only, B110 intentional except-pass
          #  cleanup paths, B104 binding 0.0.0.0 (required for containerized
          #  services behind nginx). B112 try/except/continue fallbacks are
          #  intentional and carry inline # nosec B112 (agent_tools.py marker
          #  parsing, multi_agent.py tier fallback). Everything else stays strict.
          bandit -r . -f json -o bandit-report.json \
            --skip B101,B104,B105,B106,B107,B110

      - name: "\U0001F4CB Upload security report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  # ============================================================
  # JOB 2.5: SECRET LEAK SCAN (SAST - Gitleaks)
  # ============================================================
  security-sast:
    name: "\U0001F511 Secret Leak Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "\U0001F50D Run Gitleaks secret leak detector"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================
  # JOB 3: CODE QUALITY
  # ============================================================
  lint:
    name: "\U0001F9F9 Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: "\U0001F4E6 Install linting tools"
        run: pip install flake8

      - name: "\U0001F50D Check for critical errors"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================
  # JOB 4: INTEGRATION TEST
  # ============================================================
  integration:
    name: "\U0001F517 Integration Test"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: "\U0001F4E6 Install dependencies"
        run: |
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv pypdf python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest sqlalchemy psycopg2-binary asyncpg redis mcp prometheus-client fastmcp

      - name: "\U0001F517 Test all modules import"
        run: |
          python -c "from modules.memory import ConversationMemory, FactMemory; print('Memory OK')"
          python -c "from modules.rag import SimpleRAG; print('RAG OK')"
          python -c "from modules.monitoring import AgentLogger, PerformanceMonitor; print('Monitoring OK')"
          python -c "from modules.vector_store import get_vector_store; print('Vector Store OK')"
          python -c "from modules.advanced_rag import ReRanker, SubQuestionEngine, RouterQueryEngine, AdvancedRAG; print('Advanced RAG OK')"
          python -c "from modules.cache import InMemoryCache; print('Cache OK')"

      - name: "\U0001F517 Test integration"
        env:
          GROQ_API_KEY: test_key_for_ci
        run: |
          python -c "
          from modules.memory import ConversationMemory, FactMemory
          from modules.rag import SimpleRAG
          from modules.monitoring import AgentLogger, PerformanceMonitor
          from modules.vector_store import get_vector_store

          mem = ConversationMemory()
          mem.add_message('user', 'test')

          facts = FactMemory()
          facts.remember('test', 'value')

          rag = SimpleRAG()
          rag.add_text('test content')

          monitor = PerformanceMonitor()
          monitor.track_request()

          store = get_vector_store(persist_directory='data/test_ci_chromadb')
          import shutil, os
          if os.path.exists('data/test_ci_chromadb'):
              shutil.rmtree('data/test_ci_chromadb', ignore_errors=True)

          print('All integrations passed!')
          "

  # ============================================================
  # JOB 5: DOCKER BUILD
  # ============================================================
  docker:
    name: "\U0001F433 Build & Push Docker"
    needs: [test, security, security-sast, lint, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F433 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "\U0001F510 Login to DockerHub"
        uses: docker/login-action@v3
        if: success()
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "\U0001F4BE Cache Docker layers"
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: "\U0001F3D7\uFE0F Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:v7
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # The MCP agent server runs from the SAME code/Dockerfile but is
      # published under a separate repo tag (ravneet231/llama-agent-mcp-server)
      # referenced by k8s/mcp-server.yaml. Pin it to :v7 too (Point 4).
      - name: "Build and push MCP server image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ravneet231/llama-agent-mcp-server:latest
            ravneet231/llama-agent-mcp-server:v7
            ravneet231/llama-agent-mcp-server:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: "\U0001F504 Rotate cache"
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

  # ============================================================
  # JOB 6: DEPLOY STAGING
  # ============================================================
  # Real cloud deploy. Skipped unless a base64 KUBE_CONFIG secret is set in
  # the repo (so the pipeline stays green for forks without a cluster). The
  # cluster must already have: the pinned :v7 images (built above), cert-manager
  # + External Secrets Operator installed (if used), and the runtime Secrets
  # (app-secrets / db-secrets) created via ESO or manually. Core manifests
  # only are applied here; operator/optional manifests (cert-manager.yaml,
  # external-secrets.yaml, oauth2-proxy*.yaml) are applied out-of-band.
  deploy-staging:
    name: "\U0001F3AA Deploy to Staging"
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG != ''
    environment: staging

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F527 Set up kubectl"
        uses: azure/setup-kubectl@v4

      - name: "\U0001F512 Configure kubeconfig"
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: "\U0001F680 Deploy core manifests"
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml k8s/redis.yaml k8s/chromadb.yaml
          kubectl apply -f k8s/api.yaml k8s/mcp-server.yaml k8s/web.yaml k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml k8s/frontend-ingress.yaml
          kubectl apply -f k8s/grafana.yaml k8s/prometheus.yaml k8s/loki.yaml k8s/promtail.yaml k8s/node-exporter.yaml k8s/phoenix.yaml
          kubectl apply -f k8s/grafana-ingress.yaml k8s/prometheus-ingress.yaml k8s/loki-ingress.yaml k8s/phoenix-ingress.yaml
          kubectl apply -f k8s/postgres-backup-cronjob.yaml k8s/poddisruptionbudgets.yaml k8s/api-hpa.yaml k8s/resourcequota.yaml k8s/networkpolicy.yaml

      - name: "\u23F3 Wait for rollout"
        run: |
          kubectl -n llama-agent rollout status deployment/llama-agent-api --timeout=300s
          kubectl -n llama-agent rollout status deployment/llama-agent-mcp-server --timeout=300s

  # ============================================================
  # JOB 7: DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    name: "\U0001F3ED Deploy to Production"
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.KUBE_CONFIG != ''
    environment: production

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F527 Set up kubectl"
        uses: azure/setup-kubectl@v4

      - name: "\U0001F512 Configure kubeconfig"
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: "\U0001F680 Deploy core manifests"
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml k8s/redis.yaml k8s/chromadb.yaml
          kubectl apply -f k8s/api.yaml k8s/mcp-server.yaml k8s/web.yaml k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml k8s/frontend-ingress.yaml
          kubectl apply -f k8s/grafana.yaml k8s/prometheus.yaml k8s/loki.yaml k8s/promtail.yaml k8s/node-exporter.yaml k8s/phoenix.yaml
          kubectl apply -f k8s/grafana-ingress.yaml k8s/prometheus-ingress.yaml k8s/loki-ingress.yaml k8s/phoenix-ingress.yaml
          kubectl apply -f k8s/postgres-backup-cronjob.yaml k8s/poddisruptionbudgets.yaml k8s/api-hpa.yaml k8s/resourcequota.yaml k8s/networkpolicy.yaml

      - name: "\u23F3 Wait for rollout"
        run: |
          kubectl -n llama-agent rollout status deployment/llama-agent-api --timeout=300s
          kubectl -n llama-agent rollout status deployment/llama-agent-mcp-server --timeout=300s

  # ============================================================
  # JOB 8: NOTIFY
  # ============================================================
  notify:
    name: "\U0001F4E2 Notifications"
    needs: [test, security, security-sast, lint, integration, docker, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: "\U0001F41B Create issue on failure"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline Failed: ${context.sha.slice(0,7)}`,
              body: `## Pipeline Failed!\n\n**Commit:** ${context.sha}\n**Author:** ${context.actor}\n\n[View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci-cd']
            })
