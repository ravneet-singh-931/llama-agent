name: 🚀 Full Stack CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ravneet231/llama-agent

jobs:
  # ============================================================
  # JOB 1: MATRIX TESTING
  # ============================================================
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: 📊 Upload coverage
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔍 Scan for vulnerabilities
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt || echo "⚠️ Some vulnerabilities found"
          bandit -r . -f json -o bandit-report.json || true

      - name: 📋 Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  # ============================================================
  # JOB 3: CODE QUALITY
  # ============================================================
  lint:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install linting tools
        run: pip install flake8

      - name: 🔍 Check for critical errors
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # ============================================================
  # JOB 4: INTEGRATION TEST
  # ============================================================
  integration:
    name: 🔗 Integration Test
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔗 Test all modules import
        run: |
          python -c "from modules.memory import ConversationMemory, FactMemory; print('✅ Memory OK')"
          python -c "from modules.rag import SimpleRAG; print('✅ RAG OK')"
          python -c "from modules.monitoring import AgentLogger, PerformanceMonitor; print('✅ Monitoring OK')"
          python -c "from multi_agent import MultiAgentOrchestrator; print('✅ Multi-Agent OK')"

      - name: 🔗 Test integration
        env:
          GROQ_API_KEY: test_key_for_ci
        run: |
          python -c "
          from modules.memory import ConversationMemory, FactMemory
          from modules.rag import SimpleRAG
          from modules.monitoring import AgentLogger, PerformanceMonitor
          from multi_agent import MultiAgentOrchestrator
          
          # Test all modules
          mem = ConversationMemory()
          mem.add_message('user', 'test')
          
          facts = FactMemory()
          facts.remember('test', 'value')
          
          rag = SimpleRAG()
          rag.add_text('test content')
          
          monitor = PerformanceMonitor()
          monitor.track_request()
          
          orchestrator = MultiAgentOrchestrator()
          
          print('🎉 All integrations passed!')
          "

  # ============================================================
  # JOB 5: DOCKER BUILD
  # ============================================================
  docker:
    name: 🐳 Build & Push Docker
    needs: [test, security, lint, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 💾 Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: 🔄 Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ============================================================
  # JOB 6: DEPLOY STAGING
  # ============================================================
  deploy-staging:
    name: 🎪 Deploy to Staging
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.your-agent.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Staging
        run: |
          echo "🚀 Deploying to staging..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "✅ Staging deployment complete!"

  # ============================================================
  # JOB 7: DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    name: 🏭 Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-agent.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Production
        run: |
          echo "🏭 Deploying to production..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "✅ Production deployment complete!"

  # ============================================================
  # JOB 8: NOTIFY
  # ============================================================
  notify:
    name: 📢 Notifications
    needs: [test, security, lint, integration, docker, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 🐛 Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Pipeline Failed: ${context.sha.slice(0,7)}`,
              body: `## Pipeline Failed!\n\n**Commit:** ${context.sha}\n**Author:** ${context.actor}\n\n[View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci-cd']
            })
