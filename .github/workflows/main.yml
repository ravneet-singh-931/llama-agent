name: "\U0001F680 Full Stack CI/CD Pipeline"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Manual "Run workflow" button (Actions tab). Re-runs the full pipeline on
  # the chosen branch; on main it builds and deploys that commit. Use it when
  # GitHub misses a push event (happened for the v3.4.6 merge).
  workflow_dispatch:

env:
 DOCKER_IMAGE: ravneet231/llama-agent

jobs:
  # ============================================================
  # JOB 1: MATRIX TESTING
  # ============================================================
  test:
    name: "\U0001F9EA Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: "\U0001F4E6 Install dependencies"
        # Pinned: install exactly what the Docker image ships (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      # Real ONNX reranker model (same pinned file the image ships), so
      # tests/test_reranker_onnx.py checks the real model's ranking.
      - name: "\U0001F50E Download reranker model"
        run: python scripts/download_reranker.py /tmp/reranker-model

      - name: "\U0001F9EA Run tests with coverage"
        env:
          RERANKER_TEST_MODEL_DIR: /tmp/reranker-model
        run: |
          pytest tests/ -v -m "not mcp" --tb=short -p no:phoenix \
            --cov=. --cov-report=xml --cov-report=term

      # Retrieval quality on the committed sample corpus (evals/rag/), real
      # embedding model + real reranker, no LLM. Fails on a cross-user leak, a
      # broken label, or hit@6 below 0.89 (baseline 35/38 = 0.921 on v3.4.7;
      # 0.89 allows one question to slip). Numbers go to the job summary and
      # an artifact.
      - name: "\U0001F4CF RAG retrieval eval"
        env:
          RERANKER_MODEL_DIR: /tmp/reranker-model
          GIT_SHA: ${{ github.sha }}
        run: python -m evals.rag_eval retrieval --min-hit6 0.89 --out rag-retrieval.json

      - name: "\U0001F4CE Upload RAG retrieval report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-report
          path: rag-retrieval.json
          if-no-files-found: ignore

      - name: "\U0001F4CA Upload coverage"
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================
  security:
    name: "\U0001F512 Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "\U0001F50D Scan for vulnerabilities"
        run: |
          pip install pip-audit bandit
          # Ignored CVEs are reviewed + documented:
          #  - PYSEC-2025-217, PYSEC-2026-2288/2289/2290, PYSEC-2026-3929: transformers (<5 pinned by
          #    llama-index-llms-openai-like; no 4.x/5.10 fix exists upstream yet)
          #  - PYSEC-2026-311, PYSEC-2026-3813/3814/3815: chromadb (latest 1.5.9, no upstream fix yet)
          #  - PYSEC-2026-4174: transformers load_custom_generate() remote code (no fix; the app
          #    never calls it - transformers is only a transitive dep of llama-index-llms-openai-like)
          #  - PYSEC-2026-3740: nltk (latest 3.10.3, no upstream fix yet)
          # Re-evaluate on every dependency bump; new CVEs still fail the build.
          pip-audit -r requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln PYSEC-2026-2288 \
            --ignore-vuln PYSEC-2026-2289 \
            --ignore-vuln PYSEC-2026-2290 \
            --ignore-vuln PYSEC-2026-3929 \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815 \
            --ignore-vuln PYSEC-2026-4174 \
            --ignore-vuln PYSEC-2026-3740
          # bandit: skip known non-issues (documented):
          #  B101 assert in tests (pytest standard), B105/B106/B107 hardcoded
          #  credentials in test fixtures only, B110 intentional except-pass
          #  cleanup paths, B104 binding 0.0.0.0 (required for containerized
          #  services behind nginx). B112 try/except/continue fallbacks are
          #  intentional and carry inline # nosec B112 (agent_tools.py marker
          #  parsing, multi_agent.py tier fallback). Everything else stays strict.
          bandit -r . -f json -o bandit-report.json \
            --skip B101,B104,B105,B106,B107,B110

      - name: "\U0001F4CB Upload security report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

      - name: "\U0001F40D Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "\U0001F50D Audit frontend dependencies (npm audit)"
        working-directory: frontend
        continue-on-error: true
        run: |
          npm ci
          # Report high+ severity advisories. Flip continue-on-error to false
          # once existing advisories are triaged/upgraded to make it a hard gate.
          npm audit --audit-level=high

  # ============================================================
  # JOB 2.5: SECRET LEAK SCAN (SAST - Gitleaks)
  # ============================================================
  security-sast:
    name: "\U0001F511 Secret Leak Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "\U0001F50D Run Gitleaks secret leak detector"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================================
  # JOB 3: CODE QUALITY
  # ============================================================
  lint:
    name: "\U0001F9F9 Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "\U0001F4E6 Install linting tools"
        run: pip install flake8

      - name: "\U0001F50D Check for critical errors"
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ============================================================
  # JOB 4: INTEGRATION TEST
  # ============================================================
  frontend:
    name: "\U0001F310 Frontend (typecheck, lint, build)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4
      - name: "\U0001F40D Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  integration:
    name: "\U0001F517 Integration Test"
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F40D Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "\U0001F4E6 Install dependencies"
        run: |
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn PyJWT bcrypt
          pip install python-dotenv pypdf python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest sqlalchemy psycopg2-binary asyncpg redis "mcp<2" prometheus-client "fastmcp<4"

      - name: "\U0001F517 Test all modules import"
        run: |
          python -c "from modules.memory import ConversationMemory, FactMemory; print('Memory OK')"
          python -c "from modules.rag import SimpleRAG; print('RAG OK')"
          python -c "from modules.monitoring import AgentLogger, PerformanceMonitor; print('Monitoring OK')"
          python -c "from modules.vector_store import get_vector_store; print('Vector Store OK')"
          python -c "from modules.advanced_rag import ReRanker, SubQuestionEngine, RouterQueryEngine, AdvancedRAG; print('Advanced RAG OK')"
          python -c "from modules.rag_optimizations import SemanticCache; print('Semantic Cache OK')"

      - name: "\U0001F517 Test integration"
        env:
          GROQ_API_KEY: test_key_for_ci
        run: |
          python -c "
          from modules.memory import ConversationMemory, FactMemory
          from modules.rag import SimpleRAG
          from modules.monitoring import AgentLogger, PerformanceMonitor
          from modules.vector_store import get_vector_store

          mem = ConversationMemory()
          mem.add_message('user', 'test')

          facts = FactMemory()
          facts.remember('test', 'value')

          rag = SimpleRAG()
          rag.add_text('test content')

          monitor = PerformanceMonitor()
          monitor.track_request()

          store = get_vector_store(persist_directory='data/test_ci_chromadb')
          import shutil, os
          if os.path.exists('data/test_ci_chromadb'):
              shutil.rmtree('data/test_ci_chromadb', ignore_errors=True)

          print('All integrations passed!')
          "

  # ============================================================
  # JOB 5: DOCKER BUILD
  # ============================================================
  docker:
    name: "\U0001F433 Build & Push Docker"
    needs: [test, security, security-sast, lint, frontend, integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U0001F433 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "\U0001F510 Login to DockerHub"
        uses: docker/login-action@v3
        if: success()
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: "\U0001F4BE Cache Docker layers"
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: "\U0001F3D7\uFE0F Build and push Docker image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:v7
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # The MCP agent server runs from the SAME code/Dockerfile but is
      # published under a separate repo tag (ravneet231/llama-agent-mcp-server)
      # referenced by k8s/mcp-server.yaml. Pin it to :v7 too.
      - name: "Build and push MCP server image"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ravneet231/llama-agent-mcp-server:latest
            ravneet231/llama-agent-mcp-server:v7
            ravneet231/llama-agent-mcp-server:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: "Build and push Frontend image"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ravneet231/llama-agent-frontend:latest
            ravneet231/llama-agent-frontend:v7
            ravneet231/llama-agent-frontend:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: "\U0001F504 Rotate cache"
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

  # ============================================================
  # JOB 6: DEPLOY STAGING
  # ============================================================
  # Staging and production each run in their GitHub Environment. Define
  # KUBE_CONFIG (and the app secrets) as ENVIRONMENT secrets on both
  # "staging" and "production" so each job targets its own cluster/context;
  # environment secrets override repository secrets of the same name.
  deploy-staging:
    name: "\U0001F3AA Deploy to Staging"
    needs: docker
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U00002705 Check deploy is configured"
        id: gate
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ] && [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG / DOCKER_USERNAME not set — cloud deploy skipped."
          fi

      - name: "\U0001F527 Set up kubectl"
        if: steps.gate.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4

      - name: "\U0001F512 Configure kubeconfig"
        if: steps.gate.outputs.enabled == 'true'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          kubectl config view --flatten >/dev/null && echo "✅ kubeconfig valid"
          kubectl cluster-info 2>&1 || echo "⚠️  cluster-info failed (may need first run)"

      - name: "Ensure deployment namespace exists"
        if: steps.gate.outputs.enabled == 'true'
        run: kubectl apply -f k8s/namespace.yaml

      - name: "Create runtime Secrets"
        if: steps.gate.outputs.enabled == 'true'
        # Secrets come in via env (not inlined into the script) so values
        # containing quotes/$ can't break or inject into the shell.
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GRAFANA_PW: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in DB_USERNAME DB_PASSWORD GROQ_API_KEY JWT_SECRET_KEY GRAFANA_PW; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; exit 1; fi
          done
          # DATABASE_URL may omit the password - pods also get POSTGRES_PASSWORD
          # from db-secrets and the app injects it.
          DATABASE_URL="${DATABASE_URL:-postgresql+asyncpg://${DB_USERNAME}@postgres-service:5432/llama_agent}"
          REDIS_URL="${REDIS_URL:-redis://redis-service:6379}"
          kubectl -n llama-agent create secret generic db-secrets \
            --from-literal=username="$DB_USERNAME" \
            --from-literal=password="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n llama-agent create secret generic app-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=redis-url="$REDIS_URL" \
            --from-literal=groq-api-key="$GROQ_API_KEY" \
            --from-literal=jwt-secret-key="$JWT_SECRET_KEY" \
            --from-literal=tavily-api-key="${TAVILY_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n llama-agent create secret generic grafana-secret \
            --from-literal=admin-password="$GRAFANA_PW" \
            --dry-run=client -o yaml | kubectl apply -f -
          HTPASSWD="admin:$(openssl passwd -apr1 "$GRAFANA_PW")"
          kubectl -n llama-agent create secret generic monitoring-auth \
            --from-literal=auth="$HTPASSWD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n llama-agent create configmap grafana-dashboard-llama-agent \
            --from-file=llama-agent.json=config/grafana/dashboards/llama-agent.json \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: "\U0001F680 Deploy core manifests"
        if: steps.gate.outputs.enabled == 'true'
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/chromadb.yaml
          # App Deployments are applied with this commit's immutable :<sha>
          # images already set, so each deploy is ONE rollout (no stale
          # bootstrap :v7 pods, no second surge on a CPU-tight node).
          bash k8s/apply-app.sh "${{ github.sha }}" llama-agent
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/frontend-ingress.yaml
          kubectl apply -f k8s/grafana.yaml
          kubectl apply -f k8s/prometheus.yaml
          kubectl apply -f k8s/loki.yaml
          kubectl apply -f k8s/promtail.yaml
          kubectl apply -f k8s/node-exporter.yaml
          kubectl apply -f k8s/phoenix.yaml
          kubectl apply -f k8s/grafana-ingress.yaml
          kubectl apply -f k8s/prometheus-ingress.yaml
          kubectl apply -f k8s/loki-ingress.yaml
          kubectl apply -f k8s/phoenix-ingress.yaml
          kubectl apply -f k8s/postgres-backup-cronjob.yaml
          kubectl apply -f k8s/poddisruptionbudgets.yaml
          kubectl apply -f k8s/api-hpa.yaml
          kubectl apply -f k8s/resourcequota.yaml
          kubectl apply -f k8s/networkpolicy.yaml

      - name: "\u23F3 Wait for rollout"
        if: steps.gate.outputs.enabled == 'true'
        # API gets 1200s (= its progressDeadlineSeconds): its 2 replicas are
        # replaced one after another and each has a 10-min startupProbe budget. Prints diagnostics + annotations on failure
        # and warns if the API can't reach Redis.
        run: bash k8s/wait-rollout.sh llama-agent

  # ============================================================
  # JOB 7: DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    name: "\U0001F3ED Deploy to Production"
    needs: deploy-staging
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: "\U0001F4E5 Checkout code"
        uses: actions/checkout@v4

      - name: "\U00002705 Check deploy is configured"
        id: gate
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ] && [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "KUBE_CONFIG / DOCKER_USERNAME not set — cloud deploy skipped."
          fi

      - name: "\U0001F527 Set up kubectl"
        if: steps.gate.outputs.enabled == 'true'
        uses: azure/setup-kubectl@v4

      - name: "\U0001F512 Configure kubeconfig"
        if: steps.gate.outputs.enabled == 'true'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          kubectl config view --flatten >/dev/null && echo "✅ kubeconfig valid"
          kubectl cluster-info 2>&1 || echo "⚠️  cluster-info failed (may need first run)"

      - name: "Ensure deployment namespace exists"
        if: steps.gate.outputs.enabled == 'true'
        run: kubectl apply -f k8s/namespace.yaml

      - name: "Create runtime Secrets"
        if: steps.gate.outputs.enabled == 'true'
        # Secrets come in via env (not inlined into the script) so values
        # containing quotes/$ can't break or inject into the shell.
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GRAFANA_PW: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for v in DB_USERNAME DB_PASSWORD GROQ_API_KEY JWT_SECRET_KEY GRAFANA_PW; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; exit 1; fi
          done
          # DATABASE_URL may omit the password - pods also get POSTGRES_PASSWORD
          # from db-secrets and the app injects it.
          DATABASE_URL="${DATABASE_URL:-postgresql+asyncpg://${DB_USERNAME}@postgres-service:5432/llama_agent}"
          REDIS_URL="${REDIS_URL:-redis://redis-service:6379}"
          kubectl -n llama-agent create secret generic db-secrets \
            --from-literal=username="$DB_USERNAME" \
            --from-literal=password="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n llama-agent create secret generic app-secrets \
            --from-literal=database-url="$DATABASE_URL" \
            --from-literal=redis-url="$REDIS_URL" \
            --from-literal=groq-api-key="$GROQ_API_KEY" \
            --from-literal=jwt-secret-key="$JWT_SECRET_KEY" \
            --from-literal=tavily-api-key="${TAVILY_API_KEY:-}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n llama-agent create secret generic grafana-secret \
            --from-literal=admin-password="$GRAFANA_PW" \
            --dry-run=client -o yaml | kubectl apply -f -
          HTPASSWD="admin:$(openssl passwd -apr1 "$GRAFANA_PW")"
          kubectl -n llama-agent create secret generic monitoring-auth \
            --from-literal=auth="$HTPASSWD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n llama-agent create configmap grafana-dashboard-llama-agent \
            --from-file=llama-agent.json=config/grafana/dashboards/llama-agent.json \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: "\U0001F680 Deploy core manifests"
        if: steps.gate.outputs.enabled == 'true'
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/chromadb.yaml
          # App Deployments are applied with this commit's immutable :<sha>
          # images already set, so each deploy is ONE rollout (no stale
          # bootstrap :v7 pods, no second surge on a CPU-tight node).
          bash k8s/apply-app.sh "${{ github.sha }}" llama-agent
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/frontend-ingress.yaml
          kubectl apply -f k8s/grafana.yaml
          kubectl apply -f k8s/prometheus.yaml
          kubectl apply -f k8s/loki.yaml
          kubectl apply -f k8s/promtail.yaml
          kubectl apply -f k8s/node-exporter.yaml
          kubectl apply -f k8s/phoenix.yaml
          kubectl apply -f k8s/grafana-ingress.yaml
          kubectl apply -f k8s/prometheus-ingress.yaml
          kubectl apply -f k8s/loki-ingress.yaml
          kubectl apply -f k8s/phoenix-ingress.yaml
          kubectl apply -f k8s/postgres-backup-cronjob.yaml
          kubectl apply -f k8s/poddisruptionbudgets.yaml
          kubectl apply -f k8s/api-hpa.yaml
          kubectl apply -f k8s/resourcequota.yaml
          kubectl apply -f k8s/networkpolicy.yaml

      - name: "\u23F3 Wait for rollout"
        if: steps.gate.outputs.enabled == 'true'
        # API gets 1200s (= its progressDeadlineSeconds): its 2 replicas are
        # replaced one after another and each has a 10-min startupProbe budget. Prints diagnostics + annotations on failure
        # and warns if the API can't reach Redis.
        run: bash k8s/wait-rollout.sh llama-agent

  # ============================================================
  # JOB 8: NOTIFY
  # ============================================================
  notify:
    name: "\U0001F4E2 Notifications"
    needs: [test, security, security-sast, lint, frontend, integration, docker, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: "\U0001F41B Create issue on failure"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline Failed: ${context.sha.slice(0,7)}`,
              body: `## Pipeline Failed!\n\n**Commit:** ${context.sha}\n**Author:** ${context.actor}\n\n[View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci-cd']
            })
