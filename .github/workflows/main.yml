name: 🚀 Advanced CI/CD Pipeline

# ============================================
# TRIGGER: When does this pipeline run?
# ============================================
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ============================================
# ENVIRONMENT VARIABLES (shared across jobs)
# ============================================
env:
  PYTHON_VERSIONS: '["3.9", "3.10", "3.11"]'
  DOCKER_IMAGE: ravneet231/llama-agent

jobs:
  # ============================================================
  # JOB 1: MATRIX TESTING (tests on multiple Python versions)
  # ============================================================
  # WHY? Your code might work on Python 3.10 but break on 3.9
  # This tests ALL versions at the same time (parallel!)
  test:
    name: 🧪 Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Don't stop if one version fails
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      # Step 1: Check out code
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python (from matrix)
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 3: CACHE pip packages (makes builds 5x faster!)
      # WHY? Without cache, GitHub downloads ALL packages every time
      # With cache, it reuses downloaded packages from last time
      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install dependencies
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Run tests with COVERAGE
      # WHY coverage? Shows what % of your code is tested
      # If coverage is low, you need more tests!
      - name: 🧪 Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      # Step 6: Upload coverage to Codecov (free service)
      # Shows a nice coverage badge on your README
      - name: 📊 Upload coverage report
        if: matrix.python-version == '3.10'  # Only upload once
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # JOB 2: SECURITY SCANNING
  # ============================================================
  # WHY? Some packages have known security vulnerabilities
  # This checks BEFORE your code goes to production
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Security scan: checks for vulnerable packages
      - name: 🔍 Scan for vulnerabilities
        run: |
          pip install safety bandit
          safety check -r requirements.txt
          bandit -r . -f json -o bandit-report.json || true

      # Upload security report
      - name: 📋 Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-report
          path: bandit-report.json

  # ============================================================
  # JOB 3: LINT & CODE QUALITY
  # ============================================================
  # WHY? Ensures your code looks clean and follows standards
  lint:
    name: 🧹 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install linting tools
        run: pip install flake8 black isort

      # Check code style (PEP 8)
      - name: 🔍 Check code style
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics

      # Check formatting (optional, won't fail)
      - name: 🎨 Check formatting
        run: black --check . || echo "Run 'black .' to fix formatting"

  # ============================================================
  # JOB 4: BUILD & PUSH DOCKER (only if ALL above pass)
  # ============================================================
  docker:
    name: 🐳 Build & Push Docker
    needs: [test, security, lint]  # Wait for ALL 3 jobs
    runs-on: ubuntu-latest
    # Only push to Docker Hub on main branch (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Cache Docker layers (makes build 3x faster!)
      - name: 💾 Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # Rotate cache (prevents cache from growing too large)
      - name: 🔄 Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ============================================================
  # JOB 5: DEPLOY TO STAGING (auto-deploy on main branch)
  # ============================================================
  deploy-staging:
    name: 🎪 Deploy to Staging
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.your-agent.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "✅ Staging deployment complete!"
          # Add your actual deployment commands here:
          # ssh deploy@staging-server "docker pull ${{ env.DOCKER_IMAGE }}:latest && docker-compose up -d"

  # ============================================================
  # JOB 6: DEPLOY TO PRODUCTION (manual approval required!)
  # ============================================================
  deploy-production:
    name: 🏭 Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://your-agent.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Production
        run: |
          echo "🏭 Deploying to PRODUCTION..."
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "✅ Production deployment complete!"
          # Add your actual deployment commands here:
          # ssh deploy@production-server "docker pull ${{ env.DOCKER_IMAGE }}:latest && docker-compose up -d"

  # ============================================================
  # JOB 7: NOTIFY (runs ALWAYS, even if something fails)
  # ============================================================
  notify:
    name: 📢 Send Notifications
    needs: [test, security, lint, docker, deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always()  # Run even if previous jobs failed

    steps:
      # Notify on Slack/Discord (optional)
      - name: 📱 Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true  # Don't fail if Slack is not configured

      # Create GitHub issue on failure
      - name: 🐛 Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Pipeline Failed: ${context.sha.slice(0,7)}`,
              body: `## Pipeline Failed!\n\n**Commit:** ${context.sha}\n**Author:** ${context.actor}\n**Workflow:** ${context.workflow}\n\n[View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci-cd']
            })
