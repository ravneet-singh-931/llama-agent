name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv PyPDF2 python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest sqlalchemy psycopg2-binary redis

      - name: Run advanced RAG tests
        run: pytest test_advanced_rag.py -v --tb=short

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax (AST parse)
        run: |
          python -c "
          import ast, sys

          files = [
              'app.py',
              'api.py',
              'test_advanced_rag.py',
              'modules/advanced_rag.py',
              'modules/vector_store.py',
              'modules/security.py',
              'modules/auth.py',
              'modules/memory.py',
              'modules/config.py',
              'modules/cache.py',
              'modules/security_hardening.py',
              'modules/advanced_monitoring.py',
              'modules/database_improvements.py',
              'modules/cicd_improvements.py',
          ]

          errors = 0
          for f in files:
              try:
                  with open(f, encoding='utf-8') as fh:
                      ast.parse(fh.read())
                  print(f'[OK] {f}')
              except FileNotFoundError:
                  print(f'[SKIP] {f} - not found')
              except SyntaxError as e:
                  print(f'[FAIL] {f} - {e}')
                  errors += 1

          if errors:
              sys.exit(1)
          print(f'\n[OK] All checked files have valid syntax')
          "

  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          echo "Scanning for potential API keys..."
          FOUND=$(grep -r "sk-" --include="*.py" . 2>/dev/null | grep -v "test_" | grep -v "# " || true)
          if [ -n "$FOUND" ]; then
            echo "[WARN] Found potential API keys:"
            echo "$FOUND"
          else
            echo "[OK] No hardcoded API keys found"
          fi

      - name: Check secrets directory is not tracked
        run: |
          TRACKED=$(git ls-files secrets/ 2>/dev/null || true)
          if [ -n "$TRACKED" ]; then
            echo "[FAIL] Secrets directory is tracked by git!"
            echo "$TRACKED"
            exit 1
          else
            echo "[OK] Secrets directory is properly gitignored"
          fi
