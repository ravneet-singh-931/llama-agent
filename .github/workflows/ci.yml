# ============================================
# CI/CD Pipeline - Llama Agent
# ============================================
# Runs automatically on every push to GitHub
#
# What it does:
#   1. Runs unit tests (RAG features)
#   2. Validates Python syntax
#   3. Security scan (no hardcoded secrets)
#   4. Builds Docker images
#   5. Validates docker-compose
#
# NOTE: Heavy packages (arize-phoenix, chromadb) are
# skipped in CI to keep it fast. Docker builds test
# full dependency installation.
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =============================================
  # Job 1: Run Tests
  # =============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install groq llama-index-core llama-index-llms-groq
          pip install chromadb pydantic fastapi uvicorn python-jose bcrypt
          pip install python-dotenv PyPDF2 python-docx pandas
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
          pip install pytest

      - name: Run advanced RAG tests
        run: pytest test_advanced_rag.py -v --tb=short

  # =============================================
  # Job 2: Code Quality
  # =============================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check Python syntax (AST parse)
        run: |
          python -c "
          import ast, sys, os

          files = []
          for root, dirs, filenames in os.walk('.'):
              # skip hidden dirs and __pycache__
              dirs[:] = [d for d in dirs if not d.startswith('.') and d != '__pycache__']
              for f in filenames:
                  if f.endswith('.py'):
                      files.append(os.path.join(root, f))

          errors = 0
          for f in files:
              try:
                  with open(f, encoding='utf-8') as fh:
                      ast.parse(fh.read())
                  print(f'[OK] {f}')
              except SyntaxError as e:
                  print(f'[FAIL] {f} - {e}')
                  errors += 1

          if errors:
              sys.exit(1)
          print(f'\n[OK] All {len(files)} Python files have valid syntax')
          "

  # =============================================
  # Job 3: Security Scan
  # =============================================
  security:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for hardcoded API keys
        run: |
          echo "Scanning for potential API keys..."
          FOUND=$(grep -r "sk-" --include="*.py" . 2>/dev/null | grep -v "test_" | grep -v "# " || true)
          if [ -n "$FOUND" ]; then
            echo "[WARN] Found potential API keys:"
            echo "$FOUND"
          else
            echo "[OK] No hardcoded API keys found"
          fi

      - name: Check for hardcoded passwords
        run: |
          FOUND=$(grep -rn "password.*=.*['\"]" --include="*.py" . 2>/dev/null \
            | grep -v "password_file\|password_hash\|POSTGRES_PASSWORD\|hashed_password\|verify_password\|hash_password\|password_manager\|password_field\|password_label\|password: " \
            || true)
          if [ -n "$FOUND" ]; then
            echo "[WARN] Found potential hardcoded passwords:"
            echo "$FOUND"
          else
            echo "[OK] No hardcoded passwords found"
          fi

      - name: Check secrets directory is not tracked
        run: |
          TRACKED=$(git ls-files secrets/ 2>/dev/null || true)
          if [ -n "$TRACKED" ]; then
            echo "[FAIL] Secrets directory is tracked by git!"
            echo "$TRACKED"
            exit 1
          else
            echo "[OK] Secrets directory is properly gitignored"
          fi

  # =============================================
  # Job 4: Build Docker Images
  # =============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web/api image
        run: docker build -t llama-agent-app:test .

      - name: Build Nginx image
        run: docker build -t llama-agent-nginx:test -f Dockerfile.nginx .

      - name: Validate docker-compose config
        run: docker-compose config --quiet
