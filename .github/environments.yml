# ============================================
# GitHub Environments Configuration
# ============================================
# This file defines deployment environments
# GitHub will show these in Settings → Environments

staging:
  description: "Staging environment for testing"
  protection_rules:
    required_reviewers: []  # No approval needed for staging
  
production:
  description: "Production environment (live)"
  protection_rules:
    required_reviewers:
      - ravneet-png  # Only YOU can approve production deploys
    wait_timer: 5  # Wait 5 minutes before deploying
