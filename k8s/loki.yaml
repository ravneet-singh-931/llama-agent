# ============================================
# Loki - Log aggregation
# ============================================
# Service is named "loki" so the Grafana datasource URL
# http://loki:3100 and the promtail push URL http://loki:3100
# resolve unchanged inside the cluster.
#
# Loki image runs as UID 10001; Docker Desktop's hostpath PVCs are
# root-owned, so we run as root (runAsUser: 0) to allow writes to /loki.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: llama-agent
  labels:
    app: llama-agent
    component: loki
data:
  loki-config.yml: |
    # ============================================
    # Loki Configuration (k8s) - Log Aggregation
    # ============================================

    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h   # 7 days

    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: llama-agent
  labels:
    app: llama-agent
    component: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-agent
      component: loki
  template:
    metadata:
      labels:
        app: llama-agent
        component: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.6
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          securityContext:
            runAsUser: 0
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/loki/local-config.yaml
              subPath: loki-config.yml
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: loki
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: llama-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
