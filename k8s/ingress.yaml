# ============================================
# Ingress - Routes external traffic
# Host: llama-agent.local (add to /etc/hosts)
#
# Path routing (capture groups are passed through via rewrite-target):
#   /api/*      -> API backend (prefix stripped)
#   /ws/*       -> API WebSocket port (prefix stripped)
#   /mcp/*      -> MCP agent server (prefix stripped)
#   /streamlit/*-> Streamlit web UI (prefix stripped)
#
# NOTE: the Next.js frontend catch-all lives in frontend-ingress.yaml with
# NO rewrite-target. The global /$2 here would corrupt /_next/static/* paths
# (the /(.*) pattern has only one capture group, so $2 is empty and every
# asset request rewrites to / -> index.html -> black screen).
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llama-agent-ingress
  namespace: llama-agent
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # WebSocket + SSE support (harmless for plain HTTP backends)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # NOTE: configuration-snippet intentionally NOT used - it is disabled by
    # default in ingress-nginx (allow-snippet-annotations=false) for security.
    # WebSocket Upgrade/Connection headers are set automatically by ingress-nginx.

    # ---- Point 1: TLS via cert-manager ----
    # For the local lab (.local) swap to "selfsigned"; for real cloud use
    # "letsencrypt-prod" (default here) with a public FQDN host.
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # ---- Point 3: Rate limiting (per-client-IP) ----
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"

    # ---- Point 3: WAF (ModSecurity + OWASP Core Rule Set) ----
    # Requires the ingress-nginx controller to be deployed with ModSecurity
    # enabled (--enable-modsecurity / modsecurity-snippet). On cloud-managed
    # ingress-nginx enable it in the controller ConfigMap; the annotations
    # below then turn the rules on for this ingress.
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyLimit 10485760
      SecRequestBodyNoFilesLimit 1048576
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - llama-agent.local
      secretName: llama-agent-tls
  rules:
    - host: llama-agent.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: llama-agent-api-service
                port:
                  number: 8000
          - path: /ws(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: llama-agent-api-service
                port:
                  number: 8000
          - path: /mcp(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: llama-agent-mcp-server-service
                port:
                  number: 8001
          - path: /streamlit(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: llama-agent-web-service
                port:
                  number: 8501
