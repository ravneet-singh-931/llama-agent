# ============================================
# HorizontalPodAutoscaler — API + MCP server (Point 7)
# ============================================
# Scales on CPU utilization (requires metrics-server in the cluster). The API
# is stateless (shared Redis/Chroma/Postgres), so it scales horizontally; the
# MCP server is lighter and scales more conservatively. Min replicas stay at
# the current deployed count so autoscaling never drops below a safe floor.
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llama-agent-api-hpa
  namespace: llama-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-agent-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llama-agent-mcp-hpa
  namespace: llama-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llama-agent-mcp-server
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
