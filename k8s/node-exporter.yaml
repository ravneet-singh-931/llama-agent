# ============================================
# Node Exporter - System metrics (DaemonSet)
# ============================================
# Service is named "node-exporter" so the Prometheus scrape target
# node-exporter:9100 (prometheus.yml) resolves unchanged.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: llama-agent
  labels:
    app: llama-agent
    component: node-exporter
spec:
  selector:
    matchLabels:
      app: llama-agent
      component: node-exporter
  template:
    metadata:
      labels:
        app: llama-agent
        component: node-exporter
    spec:
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/rootfs
            - --web.listen-address=:9100
          ports:
            - containerPort: 9100
              name: metrics
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /rootfs
              readOnly: true
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: node-exporter
  ports:
    - port: 9100
      targetPort: 9100
      name: metrics
  type: ClusterIP
