# ============================================
# oauth2-proxy callback ingress (Point 2 — SSO)
# ============================================
# Applied only when OIDC_ENABLED=true in k8s/deploy.sh. Hosts the
# /oauth2/* endpoints that ingress-nginx external-auth redirects to.
# The observability ingresses (grafana/prometheus/loki/phoenix) get
# external-auth annotations pointing at this service when SSO is enabled.
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-ingress
  namespace: llama-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - oauth.llama-agent.local
      secretName: oauth2-proxy-tls
  rules:
    - host: oauth.llama-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 4180
