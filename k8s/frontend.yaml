# ============================================
# Next.js Frontend Deployment + Service
# Image must be built with: NEXT_PUBLIC_API_URL=/api
# (docker build --build-arg NEXT_PUBLIC_API_URL=/api -t ravneet231/llama-agent-frontend:latest ./frontend)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-agent-frontend
  namespace: llama-agent
  labels:
    app: llama-agent
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llama-agent
      component: frontend
  template:
    metadata:
      labels:
        app: llama-agent
        component: frontend
    spec:
      containers:
        - name: frontend
          image: ravneet231/llama-agent-frontend:latest
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: llama-agent-frontend-service
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
