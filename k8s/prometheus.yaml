# ============================================================================
# 📚 LEARNER GUIDE: Prometheus — k8s/prometheus.yaml (Metrics Collection)
# ============================================================================
# WHAT IS PROMETHEUS?
# -------------------
# Prometheus is a metrics database that SCRAPES (pulls) metrics from targets
# every 15s and stores them as time-series. Grafana then visualizes them.
#   - Metrics: Request count, error rate, response time, CPU, memory, etc.
#   - Alerts: Rules that fire when thresholds exceeded (e.g., API down)
#
# WHAT DOES THIS FILE DO?
# -----------------------
# Creates 4 resources:
#   1. ConfigMap `prometheus-config` → prometheus.yml + alerts.yml
#   2. Deployment (1 replica, Prometheus on port 9090)
#   3. Service (ClusterIP, DNS: prometheus:9090)
#   4. PVC (2Gi for metrics data, 30d retention)
#
# SCRAPE TARGETS (prometheus.yml):
# --------------------------------
#   - every API Pod :8000/metrics, found via DNS of llama-agent-api-headless
#   - localhost:9090 (Prometheus self)
#   - node-exporter:9100 (system metrics)
#
# ALERTS (alerts.yml):
# --------------------
#   - ApiDown, HighErrorRate, HighResponseTime, VeryHighResponseTime, ServerErrors
#   - HighCpuUsage, HighMemoryUsage, DiskSpaceLow
#
# KUBERNETES CONCEPTS:
# --------------------
# - ConfigMap for config files (mounted as /etc/prometheus)
# - Deployment with args (--config.file, --storage.tsdb.retention.time=30d)
# - Service (ClusterIP)
# - PVC for /prometheus data
# - securityContext: runAsUser 0 (root for Docker Desktop PVC)
# - Probes on /-/ready and /-/healthy
#
# HOW IT CONNECTS:
# ----------------
# - Scrapes: each API Pod (DNS service discovery on llama-agent-api-headless)
# - Scraped by: Grafana datasource http://prometheus:9090
# - Ingress: prometheus-ingress.yaml (basic-auth)
#
# FLOW:
# -----
# 1. kubectl apply -f k8s/prometheus.yaml
# 2. Deployment creates Pod with prom/prometheus:v2.51.0
# 3. Pod mounts ConfigMap, starts Prometheus, scrapes targets every 15s
# 4. Service creates DNS: prometheus → Pod IP
# 5. Grafana queries Prometheus for dashboards
# 6. Verify: kubectl port-forward -n llama-agent svc/prometheus 9090:9090
#            Open http://localhost:9090 → Status → Targets (should be UP)
# ============================================================================

# --------------------------------------------------------------------------
# RESOURCE 1: ConfigMap — Prometheus Config + Alerts
# --------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: llama-agent
  labels:
    app: llama-agent
    component: prometheus
data:
  # prometheus.yml: Main Prometheus config (scrape targets, intervals)
  prometheus.yml: |
    # Prometheus Configuration (k8s) - Scrapes metrics from all services
    global:
      scrape_interval: 15s       # How often to pull metrics (15 seconds)
      evaluation_interval: 15s   # How often to evaluate alert rules

    # Alert rules file (alerts.yml below, mounted at /etc/prometheus/alerts.yml)
    rule_files:
      - /etc/prometheus/alerts.yml

    # Scrape targets: Where to pull metrics from
    scrape_configs:
      # ---- FastAPI Application Metrics ----
      - job_name: "llama-agent-api"  # Job name (for labeling)
        metrics_path: "/metrics"     # Path on target (FastAPI exposes /metrics)
        # One target per API Pod (not the load-balanced Service, which would
        # hit a random replica per scrape). The headless Service's DNS name
        # resolves to every ready Pod IP; `instance` = Pod IP:8000.
        dns_sd_configs:
          - names: ["llama-agent-api-headless.llama-agent.svc.cluster.local"]
            type: A
            port: 8000
            refresh_interval: 30s
        relabel_configs:
          - target_label: service
            replacement: "llama-agent-api"
          - target_label: environment
            replacement: "production"

      # ---- Prometheus Self-Monitoring ----
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]  # Itself

      # ---- Node Exporter (System Metrics) ----
      - job_name: "node-exporter"
        static_configs:
          - targets: ["node-exporter:9100"]  # Node Exporter Service
            labels:
              service: "system"

      # ---- Container Metrics (via cAdvisor if added) ----
      # Uncomment when cadvisor is added to docker-compose/k8s
      # - job_name: "cadvisor"
      #   static_configs:
      #     - targets: ["cadvisor:8080"]

  # alerts.yml: Alert rules (when to fire alerts)
  alerts.yml: |
    # Prometheus Alert Rules (k8s)
    groups:
      # ---- Application Alerts ----
      - name: llama_agent_app
        rules:
          # Alert if API is down (scrape failing or target missing for 2m)
          - alert: ApiDown
            expr: up{job="llama-agent-api"} == 0 or absent(up{job="llama-agent-api"})
            for: 2m  # Fire after 2 minutes down
            labels:
              severity: critical
              service: llama-agent
            annotations:
              summary: "API is DOWN"
              description: "Llama Agent API has not been reachable for 2 minutes."

          # Alert: estimated Groq spend > $10 over 24h (llama_agent_llm_cost_usd_total)
          - alert: HighLLMSpend
            expr: sum(increase(llama_agent_llm_cost_usd_total[24h])) > 10
            for: 10m
            labels:
              severity: warning
              service: llama-agent
            annotations:
              summary: "LLM spend above $10 in 24h"
              description: "Estimated Groq spend over the last 24h is ${{ $value | printf \"%.2f\" }}."

          # Alert if error rate > 5 errors/sec for 5m
          - alert: HighErrorRate
            expr: sum without (instance) (rate(llama_agent_errors_total[5m])) > 5
            for: 5m
            labels:
              severity: warning
              service: llama-agent
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value }} errors/sec (threshold: 5)."

          # Alert if P95 response time > 5s for 5m
          - alert: HighResponseTime
            expr: histogram_quantile(0.95, sum without (instance) (rate(llama_agent_response_time_seconds_bucket[5m]))) > 5
            for: 5m
            labels:
              severity: warning
              service: llama-agent
            annotations:
              summary: "Slow API responses detected"
              description: "P95 response time is {{ $value | humanizeDuration }} (threshold: 5s)."

          # Alert if P99 > 10s (critical)
          - alert: VeryHighResponseTime
            expr: histogram_quantile(0.99, sum without (instance) (rate(llama_agent_response_time_seconds_bucket[5m]))) > 10
            for: 5m
            labels:
              severity: critical
              service: llama-agent
            annotations:
              summary: "CRITICAL: Very slow API responses"
              description: "P99 response time is {{ $value | humanizeDuration }} (threshold: 10s)."

          # Alert if 5xx errors > 1/sec for 5m
          - alert: ServerErrors
            expr: sum without (instance) (rate(llama_agent_http_responses_total{status_code=~"5.."}[5m])) > 1
            for: 5m
            labels:
              severity: warning
              service: llama-agent
            annotations:
              summary: "Server errors (5xx) detected"
              description: "{{ $value }} 5xx responses/sec detected."

      # ---- Infrastructure Alerts ----
      - name: llama_agent_infra
        rules:
          - alert: HighCpuUsage
            expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 10m
            labels:
              severity: warning
              service: system
            annotations:
              summary: "High CPU usage"
              description: "CPU usage is {{ $value | humanize }}% (threshold: 85%)."

          - alert: HighMemoryUsage
            expr: 100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100) > 90
            for: 5m
            labels:
              severity: warning
              service: system
            annotations:
              summary: "High memory usage"
              description: "Memory usage is {{ $value | humanize }}% (threshold: 90%)."

          - alert: DiskSpaceLow
            expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
            for: 5m
            labels:
              severity: critical
              service: system
            annotations:
              summary: "Disk space critically low"
              description: "Only {{ $value | humanize }}% disk space remaining."

---
# --------------------------------------------------------------------------
# RESOURCE 2: Deployment — Prometheus Pod
# --------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: llama-agent
  labels:
    app: llama-agent
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-agent
      component: prometheus
  template:
    metadata:
      labels:
        app: llama-agent
        component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0  # Prometheus version
          args:
            - --config.file=/etc/prometheus/prometheus.yml  # Config file path
            - --storage.tsdb.retention.time=30d             # Keep data 30 days
            - --web.enable-lifecycle                        # Enable reload via API
          ports:
            - containerPort: 9090  # Prometheus UI/API port
              name: http
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"  # Prometheus can use more memory for queries
              cpu: "1"
          securityContext:
            runAsUser: 0  # Root for Docker Desktop PVC
          readinessProbe:
            httpGet:
              path: /-/ready  # Prometheus ready endpoint
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy  # Prometheus healthy endpoint
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus  # Config files
              readOnly: true
            - name: data
              mountPath: /prometheus      # Data directory
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-pvc

---
# --------------------------------------------------------------------------
# RESOURCE 3: Service — Stable DNS for Prometheus
# --------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: prometheus  # DNS: prometheus.llama-agent.svc.cluster.local (used in Grafana datasource)
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  type: ClusterIP

---
# --------------------------------------------------------------------------
# RESOURCE 4: PVC — Persistent Storage for Metrics
# --------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: llama-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi  # 2Gi for 30d of metrics (adjust based on scrape interval and targets)

# 💡 LEARNER TIP: PromQL queries to try in Prometheus UI (http://localhost:9090)
#   up{job="llama-agent-api"}  → Is API up? (1 = up, 0 = down)
#   rate(llama_agent_requests_total[5m])  → Request rate per second
#   histogram_quantile(0.95, rate(llama_agent_response_time_seconds_bucket[5m]))  → P95 latency
