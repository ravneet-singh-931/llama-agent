# ============================================
# MCP Agent Server Deployment + Service
# Exposes 5 specialized agents as MCP tools (SSE transport)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-agent-mcp-server
  namespace: llama-agent
  labels:
    app: llama-agent
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-agent
      component: mcp-server
  template:
    metadata:
      labels:
        app: llama-agent
        component: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: ravneet231/llama-agent-mcp-server:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "mcp_agents_server.py", "--transport", "sse", "--port", "8001", "--host", "0.0.0.0"]
          ports:
            - containerPort: 8001
              name: sse
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: groq-api-key
            # Tiered defaults: strong=70b for one-shot answers/agents,
            # fast=8b for streaming chat. Delete these lines once the
            # free-tier 70b daily quota is upgraded or resets.
            - name: LLM_MODEL_STRONG
              value: llama-3.3-70b-versatile
            - name: LLM_MODEL_FAST
              value: llama-3.1-8b-instant
            # K8s injects PHOENIX_PORT as "tcp://<IP>:<PORT>" because the
            # "phoenix" Service exists; the phoenix client needs an integer.
            - name: PHOENIX_PORT
              value: "6006"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: llama-agent-mcp-server-service
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: mcp-server
  ports:
    - port: 8001
      targetPort: 8001
      name: sse
  type: ClusterIP
