# ============================================
# Loki Ingress — protected by basic-auth
# Host (add to /etc/hosts): loki.llama-agent.local -> Loki
#
# Basic-auth uses the SAME credentials as Grafana (admin / grafana password).
# The htpasswd secret (monitoring-auth) is created by k8s/deploy.sh from the
# gitignored secrets/grafana_admin_password.txt — never committed.
# ============================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingress
  namespace: llama-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-auth
    nginx.ingress.kubernetes.io/auth-realm: "Monitoring"
    # Point 1: TLS via cert-manager (use "selfsigned" for the .local lab)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Point 3: Rate limiting + WAF
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-rpm: "150"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - loki.llama-agent.local
      secretName: loki-tls
  rules:
    - host: loki.llama-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
