# ============================================
# Promtail - Log shipping (DaemonSet: one pod per node)
# ============================================
# The compose config used docker_sd_configs against /var/run/docker.sock.
# In k8s we use kubernetes_sd_configs (role: pod), which discovers every
# pod/container in the cluster (matching the "scrape ALL containers"
# behavior of docker_sd) and automatically sets __path__ to each
# container's log file under /var/log/pods.
#
# Runs as root (default for the promtail image) so it can read all logs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: llama-agent
---
# kubernetes_sd_configs (role: pod) needs to list/watch pods. ClusterRole
# because pod discovery is cluster-scoped (pods in ALL namespaces).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: llama-agent
roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: llama-agent
  labels:
    app: llama-agent
    component: promtail
data:
  promtail-config.yml: |
    # ============================================
    # Promtail Configuration (k8s) - Log Shipping
    # ============================================

    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:
      # ---- Scrape logs of ALL k8s pods/containers ----
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Promtail ONLY tails logs from pods on the SAME node as itself;
          # without the __host__ label every target is dropped.
          - source_labels: ["__meta_kubernetes_pod_node_name"]
            target_label: __host__
          # Set the container log file path (CRI layout):
          #   /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          # The "*" expands to "<namespace>_<pod>_" and $1 is the pod UID.
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels: ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            target_label: __path__
          # Replace namespace/pod/container names with their actual values
          - source_labels: ["__meta_kubernetes_namespace"]
            target_label: namespace
          - source_labels: ["__meta_kubernetes_pod_name"]
            target_label: pod
          - source_labels: ["__meta_kubernetes_pod_container_name"]
            target_label: container
          - source_labels: ["__meta_kubernetes_pod_label_app"]
            target_label: app
          - source_labels: ["__meta_kubernetes_pod_label_component"]
            target_label: component
          - source_labels: ["__meta_kubernetes_pod_node_name"]
            target_label: node
        pipeline_stages:
          # Parse the CRI log format (timestamp, stream, flags, message)
          - cri: {}
          # Extract log level from messages
          - regex:
              expression: '(?i)(?P<level>(ERROR|WARN|INFO|DEBUG|CRITICAL))'
          - labels:
              level:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: llama-agent
  labels:
    app: llama-agent
    component: promtail
spec:
  selector:
    matchLabels:
      app: llama-agent
      component: promtail
  template:
    metadata:
      labels:
        app: llama-agent
        component: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.6
          args:
            - -config.file=/etc/promtail/config.yml
          env:
            # Promtail drops every target whose __host__ label differs from
            # its own hostname. Setting HOSTNAME to the node name makes
            # __host__ (set from __meta_kubernetes_pod_node_name) match
            # without needing hostNetwork.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9080
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/config.yml
              subPath: promtail-config.yml
              readOnly: true
            # Container log files (kubelet CRI log layout)
            - name: varlog
              mountPath: /var/log
              readOnly: true
            # Docker-managed container logs (Docker Desktop runs k8s pods
            # as Docker containers; files live under /var/lib/docker)
            - name: dockerlog
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: dockerlog
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          emptyDir: {}
