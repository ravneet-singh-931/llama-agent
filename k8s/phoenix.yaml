# ============================================
# Phoenix (Arize) - Observability backend
# ============================================
# Serves the Phoenix UI + OTLP trace collector.
# Service is named "phoenix" so existing code that references
# http://phoenix:6006 (api.py, app.py, modules/advanced_rag.py)
# works unchanged inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: llama-agent
  labels:
    app: llama-agent
    component: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-agent
      component: phoenix
  template:
    metadata:
      labels:
        app: llama-agent
        component: phoenix
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          ports:
            - containerPort: 6006
              name: http
          env:
            - name: PHOENIX_WORKING_DIR
              value: /mnt/data
            # K8s auto-injects PHOENIX_PORT as "tcp://<IP>:<PORT>" when a
            # Service named "phoenix" exists; Phoenix requires an integer.
            - name: PHOENIX_PORT
              value: "6006"
            - name: PHOENIX_HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 6006
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 6006
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: phoenix-data
              mountPath: /mnt/data
      volumes:
        - name: phoenix-data
          persistentVolumeClaim:
            claimName: phoenix-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: phoenix
  ports:
    - port: 6006
      targetPort: 6006
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: phoenix-pvc
  namespace: llama-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
