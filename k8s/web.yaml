# ============================================================================
# 📚 LEARNER GUIDE: Streamlit Web UI (Legacy) — k8s/web.yaml
# ============================================================================
# WHAT IS THIS?
# -------------
# Runs the Streamlit legacy UI (app.py) — the OLD web interface before Next.js.
# Creates:
#   1. Deployment (1 replica, Streamlit on port 8501)
#   2. Service (ClusterIP, DNS: llama-agent-web-service:8501)
#
# WHY KEEP STREAMLIT IF WE HAVE NEXT.JS?
# ---------------------------------------
# - Legacy: Still works, some users prefer it
# - Fallback: If Next.js has issues, Streamlit is backup
# - Accessible via /streamlit/* path (Ingress)
# - Uses same Docker image as API (ravneet231/llama-agent:v7) but different command
#
# KUBERNETES CONCEPTS:
# --------------------
# - Deployment with 1 replica (in-process sessions), same image as API but `command` overrides CMD
# - Service (ClusterIP)
# - Secrets for GROQ_API_KEY, DATABASE_URL
# - Probes on `/` (Streamlit homepage)
# - emptyDir volume for logs (ephemeral)
#
# HOW IT CONNECTS:
# ----------------
# - Ingress routes /streamlit/* → Service → Pods
# - Pods connect to postgres-service, phoenix, etc. (like API)
# - Shares same image as API, so code is identical
#
# FLOW:
# -----
# 1. kubectl apply -f k8s/web.yaml
# 2. Deployment creates 2 Pods, each runs `streamlit run app.py --server.port 8501 ...`
# 3. Service creates DNS: llama-agent-web-service → 2 Pod IPs
# 4. Ingress routes http://llama-agent.local/streamlit/ → Service
# 5. Verify: kubectl logs -f deployment/llama-agent-web -n llama-agent
# ============================================================================

# --------------------------------------------------------------------------
# RESOURCE 1: Deployment — 2 Replicas of Streamlit
# --------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-agent-web  # Deployment name
  namespace: llama-agent
  labels:
    app: llama-agent
    component: web  # Component = web (for Service selector)
spec:
  # 1 replica: Streamlit keeps session state in-process (no sticky sessions
  # configured), so a second replica would randomly drop users' sessions.
  replicas: 1
  selector:
    matchLabels:
      app: llama-agent
      component: web
  template:
    metadata:
      labels:
        app: llama-agent
        component: web
    spec:
      # No docker-link env vars (REDIS_PORT=tcp://..., POSTGRES_PORT=tcp://...,
      # PHOENIX_PORT=tcp://...) - Services named redis/postgres/phoenix would
      # otherwise inject them and clobber real config. DNS names still work.
      enableServiceLinks: false
      containers:
        - name: web
          image: ravneet231/llama-agent:v7  # SAME image as API!
          imagePullPolicy: IfNotPresent

          # command: Override Docker CMD to run Streamlit instead of uvicorn
          #   - streamlit run app.py = run Streamlit app
          #   - --server.port 8501 = Streamlit port
          #   - --server.address 0.0.0.0 = listen on all interfaces
          # baseUrlPath=streamlit: served behind the ingress at /streamlit/
          command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--server.baseUrlPath=streamlit"]

          ports:
            - containerPort: 8501  # Streamlit port
              name: http

          env:
            # GROQ_API_KEY: LLM key, from Secret
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: groq-api-key

            # DATABASE_URL: Postgres connection, from Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url

            # app.py talks to Postgres with psycopg2 via POSTGRES_* vars
            - name: POSTGRES_HOST
              value: postgres-service
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url

            # LLM_MODEL_STRONG/FAST: Tiered models (like API)
            - name: LLM_MODEL_STRONG
              value: qwen/qwen3.8-27b
            - name: LLM_MODEL_FAST
              value: openai/gpt-oss-20b

            - name: ENVIRONMENT
              value: production

            # PHOENIX_PORT: Override auto-injected tcp://... to integer
            - name: PHOENIX_PORT
              value: "6006"

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /streamlit/_stcore/health  # Streamlit health (behind baseUrlPath)
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /streamlit/_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5

          volumeMounts:
            - name: logs
              mountPath: /app/logs

      volumes:
        - name: logs
          emptyDir: {}  # Ephemeral logs (Promtail ships them to Loki)

---
# --------------------------------------------------------------------------
# RESOURCE 2: Service — Stable DNS for Streamlit
# --------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: llama-agent-web-service  # DNS: llama-agent-web-service.llama-agent.svc.cluster.local
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: web
  ports:
    - port: 8501
      targetPort: 8501
      name: http
  type: ClusterIP

# 💡 LEARNER TIP: Streamlit vs Next.js
#   - Streamlit: Python-based, quick to build, but less customizable
#   - Next.js: React-based, modern, better UX, but needs Node.js build
#   - Both talk to same API (FastAPI) — they are just different frontends!
