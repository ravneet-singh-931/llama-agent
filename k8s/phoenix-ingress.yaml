# ============================================================================
# 📚 LEARNER GUIDE: Phoenix Ingress — k8s/phoenix-ingress.yaml
# ============================================================================
# WHAT IS THIS?
# -------------
# Ingress for Phoenix UI (LLM observability).
# Host: phoenix.llama-agent.local → Phoenix Service:6006
# Protected by basic-auth (like Prometheus/Loki).
#
# WHY SEPARATE INGRESS (like frontend)?
# -------------------------------------
# Phoenix serves UI at root with relative asset paths. Main ingress has
# rewrite-target: /$2 which would mangle Phoenix paths (no capture groups),
# turning POST /graphql into POST / (405 error). So Phoenix has its OWN
# Ingress with NO rewrite-target (like frontend).
#
# KUBERNETES CONCEPTS:
# --------------------
# - Ingress with host phoenix.llama-agent.local, no rewrite-target
# - Basic-auth, TLS, rate limiting, WAF
# - proxy-buffering: off (for SSE/streaming, though Phoenix is mostly HTTP)
#
# HOW IT CONNECTS:
# ----------------
# - Service: phoenix:6006 (from phoenix.yaml)
# - Secret: monitoring-auth
# - When OIDC_ENABLED=true, replaced with external-auth
#
# FLOW:
# -----
# 1. kubectl apply -f k8s/phoenix-ingress.yaml
# 2. Ingress creates route: phoenix.llama-agent.local/* → Phoenix Service
# 3. User adds `127.0.0.1 phoenix.llama-agent.local` to hosts
# 4. Opens http://phoenix.llama-agent.local → basic-auth → Phoenix UI (traces)
# 5. Verify: curl -u admin:password http://phoenix.llama-agent.local/health
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phoenix-ingress
  namespace: llama-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

    # proxy-buffering off: Don't buffer responses (for streaming, though Phoenix is HTTP)
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-auth
    nginx.ingress.kubernetes.io/auth-realm: "Monitoring"

    cert-manager.io/cluster-issuer: selfsigned

    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-rpm: "150"
    # nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    # nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - phoenix.llama-agent.local
      secretName: phoenix-tls

  rules:
    - host: phoenix.llama-agent.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phoenix
                port:
                  number: 6006

# 💡 LEARNER TIP: Phoenix vs Grafana
#   - Grafana: Metrics (Prometheus) + Logs (Loki) — system/app health
#   - Phoenix: LLM traces (which model, latency, tokens, tool calls) — AI observability
#   Both are monitoring, but different layers! Check Phoenix for "why did LLM answer wrong?"
