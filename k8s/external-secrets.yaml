# ============================================================================
# 📚 LEARNER GUIDE: External Secrets Operator (ESO) — k8s/external-secrets.yaml
# ============================================================================
# WHAT IS ESO?
# ------------
# ESO = External Secrets Operator. It syncs secrets from CLOUD secret managers
# (AWS Secrets Manager, GCP Secret Manager, etc.) into native Kubernetes Secrets.
#   - Instead of `kubectl create secret` with hand-maintained values,
#   - ESO pulls from cloud (e.g., AWS Secrets Manager) every 1h and creates K8s Secrets
#
# WHY ESO?
# --------
# - Single source of truth (cloud secret manager, not YAML)
# - Rotation: Update cloud secret, ESO syncs to K8s automatically
# - No secrets in git (even base64)
# - Works with IRSA/Workload Identity (no static keys)
#
# WHAT DOES THIS FILE DO?
# -----------------------
# Creates 4 resources (Point 6: Cloud Hardening):
#   1. ClusterSecretStore `aws-secretsmanager` → How to connect to AWS
#   2. ExternalSecret `app-secrets` → Syncs llama-agent/app → K8s Secret app-secrets
#   3. ExternalSecret `db-secrets` → Syncs llama-agent/db → K8s Secret db-secrets
#   4. ExternalSecret `oauth2-proxy-secret-eso` → Syncs llama-agent/oauth2-proxy → K8s Secret
#   + Commented GCP alternative
#
# ACTIVATION (config step, not rewrite):
# --------------------------------------
#   1. Install ESO: kubectl apply -f https://github.com/external-secrets/external-secrets/releases/latest/download/install.yaml
#   2. Create IAM/cloud credentials Secret (use IRSA in prod, not static keys)
#   3. Pre-create remote secrets in AWS:
#        aws secretsmanager create-secret --name llama-agent/app --secret-string \
#          '{"database-url":"postgresql+asyncpg://postgres@postgres-service:5432/llama_agent",
#            "redis-url":"redis://redis-service:6379","groq-api-key":"...",
#            "jwt-secret-key":"...","tavily-api-key":""}'
#        aws secretsmanager create-secret --name llama-agent/db \
#          --secret-string '{"username":"postgres","password":"..."}'
#      EVERY property referenced below must exist (use "" for an unused Tavily key),
#      otherwise the ExternalSecret never becomes Ready. database-url carries no
#      password - it is injected from db-secrets/password at runtime.
#   4. Set ESO_ENABLED=true in deploy.sh (applies this file, SKIPS static secrets.yaml)
#
# KUBERNETES CONCEPTS:
# --------------------
# - ClusterSecretStore (external-secrets.io/v1, cluster-scoped, how to connect to provider)
# - ExternalSecret (namespaced, what to sync, where to store)
# - refreshInterval: How often to sync (1h)
# - secretStoreRef: Which ClusterSecretStore to use
# - target: K8s Secret to create (name, creationPolicy)
# - data: Mapping from remote key/property to K8s Secret key
#
# HOW IT CONNECTS:
# ----------------
# - Replaces: k8s/secrets.yaml (when ESO_ENABLED=true, deploy.sh skips static Secrets)
# - Creates: Same K8s Secrets (app-secrets, db-secrets) but from cloud
# - Used by: Same Deployments (api, postgres, etc.) — no change needed!
#
# FLOW:
# -----
# 1. Install ESO operator
# 2. kubectl apply -f k8s/external-secrets.yaml
# 3. ESO watches ExternalSecrets, fetches from AWS, creates K8s Secrets
# 4. Deployments use those Secrets (same as before)
# 5. Verify: kubectl get clustersecretstore
#            kubectl get externalsecret -n llama-agent
#            kubectl describe externalsecret app-secrets -n llama-agent
#            kubectl get secret app-secrets -n llama-agent -o yaml
# ============================================================================

# --------------------------------------------------------------------------
# RESOURCE 1: ClusterSecretStore — How to Connect to AWS Secrets Manager
# --------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore  # Cluster-scoped (vs SecretStore which is namespaced)
metadata:
  name: aws-secretsmanager  # Name referenced in ExternalSecret secretStoreRef
spec:
  provider:
    aws:  # AWS provider
      service: SecretsManager  # AWS Secrets Manager (vs Parameter Store)
      region: us-east-1  # AWS region

      # auth: How to authenticate to AWS
      #   - Prefer IRSA (IAM Roles for Service Accounts) in production
      #   - This static key example is PLACEHOLDER — don't use in prod!
      auth:
        secretRef:  # Reference to K8s Secret with AWS credentials
          accessKeyID:
            name: aws-creds  # Secret name
            key: access-key-id  # Key in Secret
          secretAccessKey:
            name: aws-creds
            key: secret-access-key

---
# --------------------------------------------------------------------------
# RESOURCE 2: ExternalSecret — Sync llama-agent/app → K8s Secret app-secrets
# --------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets  # ExternalSecret name (can be same as target Secret)
  namespace: llama-agent
spec:
  refreshInterval: 1h  # Sync every 1 hour (also on create/update)

  secretStoreRef:
    name: aws-secretsmanager  # Which ClusterSecretStore to use
    kind: ClusterSecretStore

  target:
    name: app-secrets  # K8s Secret to create/update (same name as static Secret)
    creationPolicy: Owner  # Create Secret, and delete when ExternalSecret deleted

  data:
    # Each entry maps remote property to K8s Secret key
    - secretKey: database-url  # K8s Secret key
      remoteRef: { key: llama-agent/app, property: database-url }  # Remote key + property (JSON field)

    - secretKey: redis-url
      remoteRef: { key: llama-agent/app, property: redis-url }

    - secretKey: groq-api-key
      remoteRef: { key: llama-agent/app, property: groq-api-key }

    - secretKey: jwt-secret-key
      remoteRef: { key: llama-agent/app, property: jwt-secret-key }

    - secretKey: tavily-api-key
      remoteRef: { key: llama-agent/app, property: tavily-api-key }

---
# --------------------------------------------------------------------------
# RESOURCE 3: ExternalSecret — Sync llama-agent/db → K8s Secret db-secrets
# --------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: llama-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: llama-agent/db, property: username }
    - secretKey: password
      remoteRef: { key: llama-agent/db, property: password }

---
# --------------------------------------------------------------------------
# RESOURCE 4: ExternalSecret — Sync llama-agent/oauth2-proxy → K8s Secret
# --------------------------------------------------------------------------
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secret-eso  # ExternalSecret name (different from target to avoid conflict)
  namespace: llama-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-secret  # Target K8s Secret (used by oauth2-proxy.yaml)
    creationPolicy: Owner
  data:
    - secretKey: oauth-client-id
      remoteRef: { key: llama-agent/oauth2-proxy, property: oauth-client-id }
    - secretKey: oauth-client-secret
      remoteRef: { key: llama-agent/oauth2-proxy, property: oauth-client-secret }
    - secretKey: oauth-cookie-secret
      remoteRef: { key: llama-agent/oauth2-proxy, property: oauth-cookie-secret }
    - secretKey: oidc-issuer-url
      remoteRef: { key: llama-agent/oauth2-proxy, property: oidc-issuer-url }

---
