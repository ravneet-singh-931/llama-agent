# ============================================
# External Secrets Operator — secret manager integration (Point 6)
# ============================================
# Replaces hand-maintained k8s Secrets with references to a cloud secret
# manager (AWS Secrets Manager shown; GCP Secret Manager alternative
# commented at the bottom). ESO syncs remote secrets into native K8s
# Secrets (app-secrets, db-secrets, ...) on a refresh interval.
#
# ACTIVATION (config step, not a rewrite):
#   1. Install ESO:  kubectl apply -f \
#        https://github.com/external-secrets/external-secrets/releases/latest/download/install.yaml
#   2. Create the IAM/cloud credentials Secret referenced by the
#      ClusterSecretStore (use IRSA/Workload Identity in production — never
#      static keys in the repo).
#   3. Set ESO_ENABLED=true in k8s/deploy.sh. It applies THIS file and SKIPS
#      the static k8s/secrets.yaml so ESO owns the Secrets (avoids conflicts).
#   4. Pre-create the remote secrets, e.g. AWS:
#        aws secretsmanager create-secret --name llama-agent/app \
#          --secret-string '{"groq-api-key":"...","jwt-secret-key":"...",
#          "database-url":"...","redis-url":"..."}'
#
# The remote keys/properties below are the contract between this manifest
# and your secret manager — adjust names to match what you created.
# ============================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # Prefer IRSA (role annotation on the ESO service account) over static
      # keys. The auth secret below is a PLACEHOLDER; in production bind the
      # ESO SA to an IAM role via IRSA and remove this static credential.
      auth:
        secretRef:
          accessKeyID:
            name: aws-creds
            key: access-key-id
          secretAccessKey:
            name: aws-creds
            key: secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: llama-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef: { key: llama-agent/app, property: database-url }
    - secretKey: redis-url
      remoteRef: { key: llama-agent/app, property: redis-url }
    - secretKey: groq-api-key
      remoteRef: { key: llama-agent/app, property: groq-api-key }
    - secretKey: jwt-secret-key
      remoteRef: { key: llama-agent/app, property: jwt-secret-key }
    - secretKey: tavily-api-key
      remoteRef: { key: llama-agent/app, property: tavily-api-key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: llama-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: db-secrets
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: llama-agent/db, property: username }
    - secretKey: password
      remoteRef: { key: llama-agent/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-secret-eso
  namespace: llama-agent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-secret
    creationPolicy: Owner
  data:
    - secretKey: oauth-client-id
      remoteRef: { key: llama-agent/oauth2-proxy, property: oauth-client-id }
    - secretKey: oauth-client-secret
      remoteRef: { key: llama-agent/oauth2-proxy, property: oauth-client-secret }
    - secretKey: oauth-cookie-secret
      remoteRef: { key: llama-agent/oauth2-proxy, property: oauth-cookie-secret }
    - secretKey: oidc-issuer-url
      remoteRef: { key: llama-agent/oauth2-proxy, property: oidc-issuer-url }
---
