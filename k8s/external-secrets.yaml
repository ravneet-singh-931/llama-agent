# 💡 LEARNER TIP: ESO vs Static Secrets
#   - Static (secrets.yaml): Simple, for lab, but secrets in git (even base64) is risky
#   - ESO: Production, secrets in cloud, auto-sync, rotation, IRSA
#   Check: kubectl get externalsecret -n llama-agent
#          kubectl describe externalsecret app-secrets -n llama-agent  (see Status)
