# ============================================================================
# 📚 LEARNER GUIDE: Kubernetes Secrets — k8s/secrets.yaml
# ============================================================================
# WHAT IS A SECRET?
# -----------------
# A Secret is a Kubernetes object to store sensitive data (passwords, API keys,
# tokens) in base64-encoded form. It's like a locked vault inside the cluster.
# Pods can then mount Secrets as env vars or files without hardcoding them.
#
# WHY NOT JUST USE ENV VARS IN YAML?
# -----------------------------------
# - Secrets are base64-encoded (not plain text) and can be encrypted at rest
# - They are not shown in `kubectl get pods` output
# - They can be managed by External Secrets Operator (ESO) for cloud secret managers
# - Git should NEVER contain real secrets — this file has PLACEHOLDERS only!
#
# SECURITY WARNING:
# -----------------
# - This file contains FAKE/PLACEHOLDER values (e.g., "postgres" base64).
# - Real values are created via: kubectl create secret generic ... (see deploy.sh)
# - In production, use ESO (k8s/external-secrets.yaml) to sync from AWS/GCP
# - Never commit real base64 keys to git! (Gitleaks will catch it in CI)
#
# HOW IT CONNECTS:
# ----------------
# - api.yaml, postgres.yaml, web.yaml, mcp-server.yaml all do:
#     env:
#       - name: DATABASE_URL
#         valueFrom:
#           secretKeyRef:
#             name: app-secrets   ← This file creates that Secret
#             key: database-url   ← This key inside the Secret
# - The Pod's kubelet fetches the Secret and injects it as an env var
#
# BASE64 ENCODING:
# ----------------
# - `echo -n "postgres" | base64` → `cG9zdGdyZXM=`
# - `echo -n "cG9zdGdyZXM=" | base64 -d` → `postgres`
# - It's NOT encryption, just encoding! Real encryption needs etcd encryption.
#
# FLOW:
# -----
# 1. kubectl apply -f k8s/secrets.yaml  (creates 2 Secrets with fake values)
# 2. OR (production): kubectl create secret generic app-secrets --from-literal=...
# 3. Pod starts → kubelet reads Secret → injects env var → app reads it
# 4. Verify: kubectl get secrets -n llama-agent
#            kubectl get secret app-secrets -n llama-agent -o yaml
# ============================================================================

# --------------------------------------------------------------------------
# SECRET 1: Database Secrets (for PostgreSQL)
# --------------------------------------------------------------------------
# This Secret holds the Postgres username and password.
# Used by: postgres.yaml (to set POSTGRES_USER/PASSWORD) and api.yaml (DATABASE_URL)

# apiVersion: Core API for Secret
apiVersion: v1

# kind: We are creating a Secret object
kind: Secret

# metadata: Name and namespace for this Secret
metadata:
  # name: The Secret's name — referenced by other YAMLs as `name: db-secrets`
  name: db-secrets

  # namespace: Must match the namespace we created (llama-agent)
  #   - Secrets are NAMESPACED — a Pod in `llama-agent` can only see Secrets in `llama-agent`
  namespace: llama-agent

# type: Opaque = arbitrary user-defined data (most common)
#   - Other types: kubernetes.io/tls, kubernetes.io/dockerconfigjson
type: Opaque

# data: The actual secret data, base64-encoded
#   - Each key becomes an env var or file when mounted
data:
  # username: base64 of "postgres"
  #   - Generate: echo -n "postgres" | base64
  #   - Used in postgres.yaml as POSTGRES_USER
  username: cG9zdGdyZXM=  # base64 of "postgres" — CHANGE IN PRODUCTION!

  # password: base64 of "postgres" (INSECURE PLACEHOLDER!)
  #   - In production, generate a strong random: python -c "import secrets; print(secrets.token_hex(32))" | base64
  #   - Used in postgres.yaml as POSTGRES_PASSWORD
  password: cG9zdGdyZXM=  # base64 of "postgres" (CHANGE THIS! Use a strong random value)

---
# --------------------------------------------------------------------------
# SECRET 2: Application Secrets (for API, Web, MCP)
# --------------------------------------------------------------------------
# This Secret holds the app's connection strings and API keys.
# Used by: api.yaml, web.yaml, mcp-server.yaml

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets       # Referenced as `name: app-secrets` in Deployments
  namespace: llama-agent
type: Opaque
data:
  # database-url: Full Postgres connection string, base64-encoded
  #   - Decoded: postgresql+asyncpg://postgres:postgres@postgres-service:5432/llama_agent
  #   - Note: host is `postgres-service` (the Service name), not localhost!
  #   - This is how the API pod finds the Postgres pod via DNS
  database-url: cG9zdGdyZXNxbCthc3luY3BnOi8vcG9zdGdyZXM6cG9zdGdyZUBwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvbGxhbWFfYWdlbnQ=  # base64 of connection string

  # redis-url: Redis connection string, base64-encoded
  #   - Decoded: redis://redis-service:6379
  #   - Used for caching, session, and shared fact store (llama:facts)
  redis-url: cmVkaXM6Ly9yZWRpcy1zZXJ2aWNlOjYzNzk=  # base64 of "redis://redis-service:6379"

  # groq-api-key: Your Groq API key (LLM provider), base64-encoded
  #   - Get from: https://console.groq.com
  #   - Generate base64: echo -n "gsk_YOUR_KEY" | base64
  #   - PLACEHOLDER — you MUST replace this before deploying!
  groq-api-key: <YOUR_GROQ_API_KEY_BASE64>  # Replace with actual key: echo -n "gsk_..." | base64

  # jwt-secret-key: Secret for signing JWT tokens, base64-encoded
  #   - Generate: python -c "import secrets; print(secrets.token_hex(32))" | base64
  #   - Must be strong and random — never use "secret" or "password"!
  jwt-secret-key: <YOUR_JWT_SECRET_BASE64>  # Replace with actual secret: python -c "import secrets; print(secrets.token_hex(32))" | base64

# 💡 LEARNER TIP: How to create a REAL secret (don't edit this file with real values):
#   kubectl create secret generic app-secrets -n llama-agent \
#     --from-literal=database-url='postgresql+asyncpg://postgres:STRONGPASS@postgres-service:5432/llama_agent' \
#     --from-literal=redis-url='redis://redis-service:6379' \
#     --from-literal=groq-api-key='gsk_YOUR_REAL_KEY' \
#     --from-literal=jwt-secret-key='YOUR_STRONG_RANDOM_HEX'
#   This creates the Secret directly in etcd, never touching git.
