# ============================================
# Kubernetes Secrets (DO NOT COMMIT REAL VALUES)
# ============================================
# In production, use: kubectl create secret
# Example:
#   kubectl create secret generic db-secrets \
#     --from-literal=username=postgres \
#     --from-literal=password=your-password
# ============================================

# Database Secrets
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: llama-agent
type: Opaque
data:
  username: cG9zdGdyZXM=  # base64 of "postgres"
  password: cG9zdGdyZXM=  # base64 of "postgres" (CHANGE THIS!)
---
# Application Secrets
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: llama-agent
type: Opaque
data:
  database-url: cG9zdGdyZXNxbCthc3luY3BnOi8vcG9zdGdyZXM6cG9zdGdyZUBwb3N0Z3Jlcy1zZXJ2aWNlOjU0MzIvbGxhbWFfYWdlbnQ=  # base64 of connection string
  redis-url: cmVkaXM6Ly9yZWRpcy1zZXJ2aWNlOjYzNzk=  # base64 of "redis://redis-service:6379"
  groq-api-key: <YOUR_GROQ_API_KEY_BASE64>  # Replace with actual key
  jwt-secret-key: <YOUR_JWT_SECRET_BASE64>  # Replace with actual secret
