# ============================================
# Llama Agent API Deployment + Service
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-agent-api
  namespace: llama-agent
  labels:
    app: llama-agent
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llama-agent
      component: api
  template:
    metadata:
      labels:
        app: llama-agent
        component: api
    spec:
      containers:
        - name: api
          image: ravneet231/llama-agent:v5
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: groq-api-key
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret-key
            - name: MCP_SERVER_URL
              value: http://llama-agent-mcp-server-service:8001
            # Tiered defaults: strong=70b for one-shot answers/agents,
            # fast=8b for streaming chat. Delete these lines once the
            # free-tier 70b daily quota is upgraded or resets.
            - name: LLM_MODEL_STRONG
              value: llama-3.3-70b-versatile
            - name: LLM_MODEL_FAST
              value: llama-3.1-8b-instant
            - name: ENVIRONMENT
              value: production
            - name: USE_OPTIMIZED_RAG
              value: "true"
            # K8s injects PHOENIX_PORT as "tcp://<IP>:<PORT>" because the
            # "phoenix" Service exists; the phoenix client needs an integer.
            - name: PHOENIX_PORT
              value: "6006"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # startupProbe gives slow-starting apps (e.g. OptimizedRAG
          # downloading the ChromaDB embedding model on first boot) up to
          # 10 minutes before k8s treats the container as failed. Without
          # this the liveness/readiness probes kill the pod mid-download,
          # creating a restart death-spiral.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-agent-api-service
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: api
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: llama-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
