# ============================================================================
# 📚 LEARNER GUIDE: FastAPI API — k8s/api.yaml (The Brain of the App)
# ============================================================================
# WHAT IS THIS FILE?
# ------------------
# This is the MOST IMPORTANT file — it runs the FastAPI backend (api.py).
# Creates 3 resources:
#   1. Deployment (2 replicas, the API servers)
#   2. Service (ClusterIP, DNS: llama-agent-api-service:8000)
#   3. PVC (1Gi for uploads)
#
# WHAT DOES THE API DO?
# ---------------------
# - REST: POST /chat, /chat/stream (SSE), /auth/*, /documents, /mcp/*
# - WebSocket: /ws/{user_id} (real-time chat)
# - RAG: Document upload → ChromaDB → semantic search
# - Multi-agent: Routes to 5 agents via MCP server
# - Observability: Traces to Phoenix, metrics to Prometheus
#
# WHY 2 REPLICAS?
# ---------------
# - High availability: If one Pod dies, the other serves traffic
# - Load balancing: Service distributes requests round-robin
# - Shared state via Redis + ChromaDB server (so both see same facts/vectors)
#
# KUBERNETES CONCEPTS:
# --------------------
# - Deployment with 2 replicas, rolling updates
# - Service (ClusterIP) for internal discovery
# - PVC for uploads (shared? Actually ReadWriteOnce — each Pod gets own? See note)
# - Secrets for env vars (DATABASE_URL, etc.)
# - Probes: startupProbe (10 min for model download), liveness, readiness
# - Resources: requests/limits for QoS
# - imagePullPolicy: IfNotPresent (don't re-pull if already cached)
#
# HOW IT CONNECTS:
# ----------------
# - Connects TO: postgres-service, redis-service, chromadb-service, mcp-server, phoenix
# - Connected FROM: Ingress (via Service), frontend, web
# - Env vars from Secrets: app-secrets (database-url, redis-url, groq-api-key, jwt-secret-key)
#
# FLOW:
# -----
# 1. kubectl apply -f k8s/api.yaml
# 2. Deployment creates 2 Pods with ravneet231/llama-agent:v7
# 3. Each Pod runs `uvicorn api:app --host 0.0.0.0 --port 8000`
# 4. startupProbe waits up to 10 min for /health (model download)
# 5. Service creates DNS: llama-agent-api-service → 2 Pod IPs (load balanced)
# 6. Ingress routes /api/* → Service → Pods
# 7. Verify: kubectl get pods -n llama-agent -l component=api
#            kubectl logs -f deployment/llama-agent-api -n llama-agent
# ============================================================================

# --------------------------------------------------------------------------
# RESOURCE 1: Deployment — 2 Replicas of FastAPI
# --------------------------------------------------------------------------
apiVersion: apps/v1  # Deployment API
kind: Deployment
metadata:
  name: llama-agent-api  # Deployment name
  namespace: llama-agent
  labels:
    app: llama-agent      # App label (for grouping)
    component: api        # Component label (for Service selector, HPA, PDB)
spec:
  # replicas: Number of Pods to run (2 for HA)
  #   - HPA (api-hpa.yaml) can scale this to 10 based on CPU
  #   - PDB (poddisruptionbudgets.yaml) ensures at least 1 stays up during drains
  replicas: 2

  selector:
    matchLabels:
      app: llama-agent
      component: api  # Must match Pod template labels

  template:
    metadata:
      labels:
        app: llama-agent
        component: api
    spec:
      # No docker-link env vars (REDIS_PORT=tcp://..., POSTGRES_PORT=tcp://...,
      # PHOENIX_PORT=tcp://...) - Services named redis/postgres/phoenix would
      # otherwise inject them and clobber real config. DNS names still work.
      enableServiceLinks: false
      containers:
        - name: api  # Container name

          # image: Docker image for the API
          #   - Built by CI (.github/workflows/main.yml) on every main push
          #   - CD (.github/workflows/main.yml) pushes an immutable tag per commit
          #     (:<git sha>) and rolls it out with `kubectl set image`, so every
          #     deploy is a real, traceable rollout. :v7 is only the bootstrap tag.
          image: ravneet231/llama-agent:v7

          # imagePullPolicy: When to pull image
          #   - IfNotPresent: Only pull if not already cached on node
          #   - Always: Always pull (for :latest)
          #   - Never: Never pull (for local images)
          #   - Safe here because CD always deploys a NEW immutable sha tag
          imagePullPolicy: IfNotPresent

          # command: Override Docker CMD (what to run)
          #   - uvicorn = ASGI server for FastAPI
          #   - api:app = module `api.py`, variable `app` (FastAPI instance)
          #   - --host 0.0.0.0 = listen on all interfaces (k8s networking)
          #   - --port 8000 = API port
          command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]

          ports:
            - containerPort: 8000  # Container port (Service targets this)
              name: http           # Port name (for Service reference)

          # env: Environment variables (many from Secrets)
          env:
            # DATABASE_URL: Postgres connection string, from Secret `app-secrets`
            #   - Value: postgresql+asyncpg://postgres:postgres@postgres-service:5432/llama_agent
            #   - Host is Service DNS, not localhost!
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: database-url

            # POSTGRES_PASSWORD: the SAME secret Postgres was initialised with.
            #   modules/secrets.resolve_database_url injects it into DATABASE_URL,
            #   so the app and the DB password can never drift apart.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password

            # REDIS_URL: Redis connection, from Secret
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: redis-url

            # GROQ_API_KEY: LLM API key, from Secret
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: groq-api-key

            # JWT_SECRET_KEY: For signing JWT tokens, from Secret
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: jwt-secret-key

            # TAVILY_API_KEY: optional web-search key (agents fall back to
            #   DuckDuckGo when absent)
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: tavily-api-key
                  optional: true

            # MCP_SERVER_URL: Where to find MCP agent server (Service DNS)
            #   - http://llama-agent-mcp-server-service:8001/sse
            #   - The API calls this for multi-agent tasks
            - name: MCP_SERVER_URL
              value: http://llama-agent-mcp-server-service:8001/sse

            # LLM_MODEL_STRONG: Strong model for one-shot answers
            - name: LLM_MODEL_STRONG
              value: qwen/qwen3.8-27b

            # LLM_MODEL_FAST: Fast model for streaming chat
            - name: LLM_MODEL_FAST
              value: openai/gpt-oss-20b

            # ENVIRONMENT: Tells app it's in production (affects CORS, etc.)
            - name: ENVIRONMENT
              value: production

            # USE_OPTIMIZED_RAG: Enable 7-feature RAG pipeline (Hybrid, Reranker, etc.)
            #   - If false, falls back to SimpleRAG
            - name: USE_OPTIMIZED_RAG
              value: "true"

            # CHROMA_SERVER_URL: Shared ChromaDB server (all replicas same index)
            #   - Without this, each Pod has own local index (bug!)
            - name: CHROMA_SERVER_URL
              value: http://chromadb-service:8000

            # PHOENIX_PORT: Phoenix tracing port (must be integer, not tcp://...)
            #   - K8s auto-injects PHOENIX_PORT as tcp://IP:PORT if Service exists
            #   - We override to ensure it's "6006" (integer)
            - name: PHOENIX_PORT
              value: "6006"

          # resources: CPU/Memory for scheduling and limits
          resources:
            requests:
              memory: "512Mi"  # Guaranteed (torch/chromadb client/BM25 live in RAM)
              cpu: "250m"      # 0.25 CPU
            limits:
              memory: "1536Mi" # Max, else OOMKill (512Mi OOM-killed under RAG load)
              cpu: "1000m"

          # startupProbe: Gives slow-starting app time to become ready
          #   - OptimizedRAG downloads embedding model (~80MB) on first boot
          #   - Without this, liveness probe kills Pod mid-download → crash loop
          #   - Allows up to 60 failures * 10s = 600s (10 min) startup time
          startupProbe:
            httpGet:
              path: /health  # Health endpoint (api.py)
              port: 8000
            failureThreshold: 60  # Allow 60 failures before marking failed
            periodSeconds: 10     # Check every 10s

          # livenessProbe: Is container alive? If fails, kubelet restarts it
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30  # Wait 30s after start
            periodSeconds: 10

          # readinessProbe: Ready to serve traffic? If fails, Service removes Pod
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10  # Check sooner than liveness
            periodSeconds: 5

          volumeMounts:
            - name: uploads
              mountPath: /app/uploads  # Where uploaded files are stored
            - name: logs
              mountPath: /app/logs     # Where logs are written

      volumes:
        # uploads: scratch space only. Uploaded files are chunked + embedded
        #   into the shared ChromaDB server (CHROMA_SERVER_URL), which is the
        #   source of truth, so every replica sees every document. A RWO PVC
        #   can't be mounted by 2-10 replicas spread over several nodes.
        - name: uploads
          emptyDir:
            sizeLimit: 1Gi
        - name: logs
          emptyDir: {}  # Ephemeral (lost on Pod restart) — for logs shipped via Promtail

---
# --------------------------------------------------------------------------
# RESOURCE 2: Service — Stable DNS for API
# --------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: llama-agent-api-service  # DNS: llama-agent-api-service.llama-agent.svc.cluster.local
                                 # Used in Ingress and frontend API_PROXY_URL
  namespace: llama-agent
spec:
  selector:
    app: llama-agent
    component: api  # Routes to Pods with these labels (2 replicas, load balanced)
  ports:
    - port: 8000        # Service port
      targetPort: 8000  # Container port
      name: http
  type: ClusterIP  # Internal only (Ingress exposes it externally)
