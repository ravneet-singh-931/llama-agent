# ============================================
# Prometheus Alert Rules
# Defines alerts that trigger when conditions are met
# ============================================

groups:
  # ---- Application Alerts ----
  - name: llama_agent_app
    rules:
      # Alert: API is down (scrape failing, or target missing entirely)
      - alert: ApiDown
        expr: up{job="llama-agent-api"} == 0 or absent(up{job="llama-agent-api"})
        for: 2m
        labels:
          severity: critical
          service: llama-agent
        annotations:
          summary: "API is DOWN"
          description: "Llama Agent API has not been reachable for 2 minutes."

      # Alert: estimated Groq spend > $10 over 24h (llama_agent_llm_cost_usd_total)
      - alert: HighLLMSpend
        expr: sum(increase(llama_agent_llm_cost_usd_total[24h])) > 10
        for: 10m
        labels:
          severity: warning
          service: llama-agent
        annotations:
          summary: "LLM spend above $10 in 24h"
          description: "Estimated Groq spend over the last 24h is ${{ $value | printf \"%.2f\" }}."

      # Alert: High error rate (>5 errors/sec for 5 minutes)
      - alert: HighErrorRate
        expr: sum without (instance) (rate(llama_agent_errors_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: llama-agent
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec (threshold: 5)."

      # Alert: High response time (P95 > 5 seconds for 5 minutes)
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum without (instance) (rate(llama_agent_response_time_seconds_bucket{endpoint!~"/chat|/chat/stream"}[5m]))) > 5
        for: 5m
        labels:
          severity: warning
          service: llama-agent
        annotations:
          summary: "Slow API responses detected (non-chat endpoints)"
          description: "P95 response time is {{ $value | humanizeDuration }} (threshold: 5s). Chat answers are covered by the chat SLO alerts."

      # Alert: Very high response time (P99 > 10 seconds for 5 minutes)
      - alert: VeryHighResponseTime
        expr: histogram_quantile(0.99, sum without (instance) (rate(llama_agent_response_time_seconds_bucket{endpoint!~"/chat|/chat/stream"}[5m]))) > 10
        for: 5m
        labels:
          severity: critical
          service: llama-agent
        annotations:
          summary: "CRITICAL: Very slow API responses (non-chat endpoints)"
          description: "P99 response time is {{ $value | humanizeDuration }} (threshold: 10s). Chat answers are covered by the chat SLO alerts."

      # Alert: 5xx errors detected
      - alert: ServerErrors
        expr: sum without (instance) (rate(llama_agent_http_responses_total{status_code=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: llama-agent
        annotations:
          summary: "Server errors (5xx) detected"
          description: "{{ $value }} 5xx responses/sec detected."

  # ---- Chat SLOs (llama_agent_chat_seconds, recorded per /chat/stream answer) ----
  # Targets (30 days, set from measured eval numbers - see docs/SLO.md):
  #   availability: 95% of chats end with an answer, not an error/failure notice
  #   quick latency: 95% of command/document/general answers within 10s
  #   agent latency: 95% of single-agent answers within 90s
  #   @team: no latency SLO (84-247s on the Groq free tier); counted in availability
  # Error budget = 5%. Multi-window burn-rate alerts (Google SRE workbook):
  #   fast: 14.4x budget over 1h AND 5m (2% of the 30d budget in 1h)
  #   slow:  6x  budget over 6h AND 30m (5% of the 30d budget in 6h)
  # Guard: at least 5 chats in the long window, so 1 bad chat out of 2 can't page.
  - name: llama_agent_slo
    rules:
      - record: llama_agent:chat_unanswered:ratio_rate5m
        expr: sum(rate(llama_agent_chat_seconds_count{outcome=~"failed|error"}[5m])) / sum(rate(llama_agent_chat_seconds_count{outcome!="cancelled"}[5m]))
      - record: llama_agent:chat_unanswered:ratio_rate30m
        expr: sum(rate(llama_agent_chat_seconds_count{outcome=~"failed|error"}[30m])) / sum(rate(llama_agent_chat_seconds_count{outcome!="cancelled"}[30m]))
      - record: llama_agent:chat_unanswered:ratio_rate1h
        expr: sum(rate(llama_agent_chat_seconds_count{outcome=~"failed|error"}[1h])) / sum(rate(llama_agent_chat_seconds_count{outcome!="cancelled"}[1h]))
      - record: llama_agent:chat_unanswered:ratio_rate6h
        expr: sum(rate(llama_agent_chat_seconds_count{outcome=~"failed|error"}[6h])) / sum(rate(llama_agent_chat_seconds_count{outcome!="cancelled"}[6h]))
      - record: llama_agent:chat_quick_slow:ratio_rate5m
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route=~"command|document|general",outcome="ok",le=~"10(\\.0)?"}[5m])) / sum(rate(llama_agent_chat_seconds_count{route=~"command|document|general",outcome="ok"}[5m]))
      - record: llama_agent:chat_quick_slow:ratio_rate30m
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route=~"command|document|general",outcome="ok",le=~"10(\\.0)?"}[30m])) / sum(rate(llama_agent_chat_seconds_count{route=~"command|document|general",outcome="ok"}[30m]))
      - record: llama_agent:chat_quick_slow:ratio_rate1h
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route=~"command|document|general",outcome="ok",le=~"10(\\.0)?"}[1h])) / sum(rate(llama_agent_chat_seconds_count{route=~"command|document|general",outcome="ok"}[1h]))
      - record: llama_agent:chat_quick_slow:ratio_rate6h
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route=~"command|document|general",outcome="ok",le=~"10(\\.0)?"}[6h])) / sum(rate(llama_agent_chat_seconds_count{route=~"command|document|general",outcome="ok"}[6h]))
      - record: llama_agent:chat_agent_slow:ratio_rate5m
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route="agent",outcome="ok",le=~"90(\\.0)?"}[5m])) / sum(rate(llama_agent_chat_seconds_count{route="agent",outcome="ok"}[5m]))
      - record: llama_agent:chat_agent_slow:ratio_rate30m
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route="agent",outcome="ok",le=~"90(\\.0)?"}[30m])) / sum(rate(llama_agent_chat_seconds_count{route="agent",outcome="ok"}[30m]))
      - record: llama_agent:chat_agent_slow:ratio_rate1h
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route="agent",outcome="ok",le=~"90(\\.0)?"}[1h])) / sum(rate(llama_agent_chat_seconds_count{route="agent",outcome="ok"}[1h]))
      - record: llama_agent:chat_agent_slow:ratio_rate6h
        expr: 1 - sum(rate(llama_agent_chat_seconds_bucket{route="agent",outcome="ok",le=~"90(\\.0)?"}[6h])) / sum(rate(llama_agent_chat_seconds_count{route="agent",outcome="ok"}[6h]))
      - alert: ChatAvailabilitySLOBurn
        expr: (llama_agent:chat_unanswered:ratio_rate1h > (14.4 * 0.05) and llama_agent:chat_unanswered:ratio_rate5m > (14.4 * 0.05) and sum(increase(llama_agent_chat_seconds_count{outcome!="cancelled"}[1h])) >= 5) or (llama_agent:chat_unanswered:ratio_rate6h > (6 * 0.05) and llama_agent:chat_unanswered:ratio_rate30m > (6 * 0.05) and sum(increase(llama_agent_chat_seconds_count{outcome!="cancelled"}[6h])) >= 5)
        for: 2m
        labels:
          severity: warning
          service: llama-agent
        annotations:
          summary: "Chats ending in an error or failure notice are burning the error budget"
          description: "SLO: 95% of chats get an answer (30d). Failed share is {{ $value | humanizePercentage }} over the long window."
      - alert: ChatQuickLatencySLOBurn
        expr: (llama_agent:chat_quick_slow:ratio_rate1h > (14.4 * 0.05) and llama_agent:chat_quick_slow:ratio_rate5m > (14.4 * 0.05) and sum(increase(llama_agent_chat_seconds_count{route=~"command|document|general",outcome="ok"}[1h])) >= 5) or (llama_agent:chat_quick_slow:ratio_rate6h > (6 * 0.05) and llama_agent:chat_quick_slow:ratio_rate30m > (6 * 0.05) and sum(increase(llama_agent_chat_seconds_count{route=~"command|document|general",outcome="ok"}[6h])) >= 5)
        for: 2m
        labels:
          severity: warning
          service: llama-agent
        annotations:
          summary: "Quick chat answers (commands, documents, general) are too slow"
          description: "SLO: 95% of quick answers within 10s (30d). Share slower than 10s is {{ $value | humanizePercentage }} over the long window."
      - alert: ChatAgentLatencySLOBurn
        expr: (llama_agent:chat_agent_slow:ratio_rate1h > (14.4 * 0.05) and llama_agent:chat_agent_slow:ratio_rate5m > (14.4 * 0.05) and sum(increase(llama_agent_chat_seconds_count{route="agent",outcome="ok"}[1h])) >= 5) or (llama_agent:chat_agent_slow:ratio_rate6h > (6 * 0.05) and llama_agent:chat_agent_slow:ratio_rate30m > (6 * 0.05) and sum(increase(llama_agent_chat_seconds_count{route="agent",outcome="ok"}[6h])) >= 5)
        for: 2m
        labels:
          severity: warning
          service: llama-agent
        annotations:
          summary: "Single-agent answers are too slow"
          description: "SLO: 95% of single-agent answers within 90s (30d). Share slower than 90s is {{ $value | humanizePercentage }} over the long window."

  # ---- Infrastructure Alerts ----
  - name: llama_agent_infra
    rules:
      # Alert: High CPU usage (>85% for 10 minutes)
      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanize }}% (threshold: 85%)."

      # Alert: High memory usage (>90% for 5 minutes)
      - alert: HighMemoryUsage
        expr: 100 - ((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100) > 90
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanize }}% (threshold: 90%)."

      # Alert: Disk space low (<10% free)
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Disk space critically low"
          description: "Only {{ $value | humanize }}% disk space remaining."

  # ---- Database Alerts ----
  # NOTE: Disabled - no postgres-exporter is deployed in this stack.
