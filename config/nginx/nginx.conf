# ============================================
# Nginx Configuration
# - SSL/TLS Termination (HTTPS)
# - Load Balancing (multiple API replicas)
# - CDN-Ready Security Headers
# - Rate Limiting
# ============================================

# ---- Rate Limiting Zone ----
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---- Docker DNS resolver ----
# Resolve upstream container names dynamically so nginx survives
# container recreations (new IPs) without needing a restart.
resolver 127.0.0.11 valid=30s ipv6=off;

# ---- Upstream: Load Balancer across API replicas ----
upstream api_backend {
    # Shared memory zone is required for dynamic DNS re-resolution (`resolve`)
    zone api_backend 64k;
    # Nginx load balances across these using "least connections"
    least_conn;
    # `resolve` re-resolves the container name against Docker DNS
    server api:8000 resolve;
    # Add more replicas here for scaling:
    # server api-replica-1:8000;
    # server api-replica-2:8000;

    # Keep connections alive for performance
    keepalive 32;
}

upstream web_backend {
    zone web_backend 64k;
    server web:8501 resolve;
}

upstream frontend_backend {
    zone frontend_backend 64k;
    server frontend:3000 resolve;
}

upstream grafana_backend {
    zone grafana_backend 64k;
    server grafana:3000 resolve;
}

upstream mcp_backend {
    zone mcp_backend 64k;
    server mcp-server:8001 resolve;
}

# ---- Redirect HTTP to HTTPS ----
server {
    listen 80;
    server_name localhost;

    # Let's Encrypt challenge (for real SSL certs)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Main HTTPS Server ----
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # ---- SSL/TLS Configuration ----
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Modern SSL settings (A+ rating on SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- CDN-Ready Security Headers ----
    # These work with Cloudflare, AWS CloudFront, etc.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss: http://localhost:8000 http://api:8000;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide Nginx version
    server_tokens off;

    # ---- API Endpoints (Load Balanced) ----
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Timeouts (multi-agent chat can take a while)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        # SSE chat streaming must not be buffered
        proxy_buffering off;
    }

    # ---- WebSocket Endpoints ----
    location /ws/ {
        proxy_pass http://api_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ---- Next.js Frontend (main UI) ----
    location / {
        proxy_pass http://frontend_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js needs these for proper asset loading
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # No buffering for SSE
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Streamlit Web UI (legacy) ----
    location /streamlit/ {
        proxy_pass http://web_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /streamlit;

        # Streamlit WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ---- Swagger Docs (API) ----
    location /docs {
        proxy_pass http://api_backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Grafana Monitoring Dashboard ----
    location /grafana/ {
        proxy_pass http://grafana_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- MCP Agent Server (Model Context Protocol) ----
    location /mcp/ {
        proxy_pass http://mcp_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP SSE needs streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        chunked_transfer_encoding on;
    }

    # ---- Prometheus (metrics) ----
    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- Loki (logs) ----
    location /loki/ {
        proxy_pass http://loki:3100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---- Phoenix (LLM observability) ----
    location /phoenix/ {
        proxy_pass http://phoenix:6006/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Node Exporter (system metrics) ----
    location /node-exporter/ {
        proxy_pass http://node-exporter:9100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Health Check (no rate limiting) ----
    location /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
    }

    # ---- Block common attack paths ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
