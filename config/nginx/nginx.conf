# ============================================================================
# 📚 LEARNER GUIDE: Nginx Config — config/nginx/nginx.conf (Reverse Proxy)
# ============================================================================
# WHAT IS NGINX?
# --------------
# Nginx is a high-performance reverse proxy, load balancer, and web server.
# In this app, it sits in front of all services and routes traffic:
#   Browser → Nginx (80/443) → API (8000), Frontend (3000), Streamlit (8501), MCP (8001)
#
# WHAT DOES THIS CONFIG DO?
# -------------------------
# 1. Rate limiting (10 req/sec per IP)
# 2. Docker DNS resolver (for dynamic upstream resolution)
# 3. Upstreams (load balancers for each backend)
# 4. HTTP server (80, redirects to HTTPS, handles Let's Encrypt)
# 5. HTTPS server (443, SSL, security headers, proxies to backends)
#
# NGINX CONCEPTS:
# ---------------
# - limit_req_zone: Rate limiting zone
# - resolver: Docker DNS (127.0.0.11)
# - upstream: Load balancer group (least_conn, keepalive, resolve)
# - server: Virtual host (listen, server_name, location)
# - location: Path routing (proxy_pass, headers, timeouts)
# - add_header: Security headers (CSP, HSTS, etc.)
#
# HOW IT CONNECTS:
# ----------------
# - Upstreams: api:8000, web:8501, frontend:3000 (Docker DNS names; MCP stays internal)
# - Used by: Dockerfile.nginx (copied to /etc/nginx/conf.d/default.conf)
# - SSL: /etc/nginx/ssl/cert.pem, key.pem (from generate-ssl.sh or Let's Encrypt)
#
# FLOW:
# -----
# 1. Browser requests https://localhost/api/chat
# 2. Nginx (443) matches location /api/ → proxy_pass to api_backend (api:8000)
# 3. api_backend load balances to api container(s)
# 4. Response returns via Nginx to browser
# 5. Verify: docker exec <nginx-container> nginx -t (test config)
#            curl -k https://localhost/api/health (via Nginx)
# ============================================================================

# ---- Rate Limiting Zone ----
# Define a zone for rate limiting: 10 requests per second per IP
#   - `limit_req_zone $binary_remote_addr` = Key is client IP (binary, efficient)
#   - `zone=api_limit:10m` = Zone name api_limit, 10MB memory (enough for ~160k IPs)
#   - `rate=10r/s` = 10 requests per second
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ---- Docker DNS Resolver ----
# Resolve upstream container names dynamically so Nginx survives container recreations
#   - Without this, Nginx would cache DNS at startup and fail if container IP changes
#   - `127.0.0.11` = Docker's embedded DNS server (always at this IP inside containers)
#   - `valid=30s` = Cache DNS for 30s, then re-resolve
#   - `ipv6=off` = Disable IPv6 (simpler, Docker often uses IPv4)
resolver 127.0.0.11 valid=30s ipv6=off;

# ---- Upstream: Load Balancer for API (FastAPI) ----
# Upstream = Group of servers that Nginx load balances across
upstream api_backend {
    # Shared memory zone for dynamic DNS re-resolution (`resolve` needs it)
    zone api_backend 64k;

    # Load balancing method: least connections (send to server with fewest active connections)
    #   - Alternative: round_robin (default), ip_hash, etc.
    least_conn;

    # Server: api:8000 with dynamic DNS resolution
    #   - `api` = Docker Compose service name (resolves via Docker DNS to container IP)
    #   - `:8000` = Port
    #   - `resolve` = Re-resolve DNS dynamically (needs resolver and zone)
    server api:8000 resolve;

    # Add more replicas for scaling (uncomment if you scale api to 3):
    # server api-replica-1:8000;
    # server api-replica-2:8000;

    # Keep connections alive for performance (reuse TCP connections)
    keepalive 32;  # Keep 32 idle connections per worker
}

# Upstream for Streamlit (legacy UI)
upstream web_backend {
    zone web_backend 64k;
    server web:8501 resolve;  # web service (Streamlit) on 8501
}

# Upstream for Next.js Frontend (main UI)
upstream frontend_backend {
    zone frontend_backend 64k;
    server frontend:3000 resolve;  # frontend service (Next.js) on 3000
}

# Upstream for MCP Server (SSE)
# NOTE: the MCP server is internal-only (the API calls it on the Docker
# network); it is deliberately not proxied to the internet.

# ---- HTTP Server (Port 80) — Redirect to HTTPS ----
server {
    listen 80;  # Listen on HTTP
    server_name localhost;  # Server name (for Host header matching)

    # Let's Encrypt challenge (for real SSL certs via certbot)
    #   - Certbot places challenge files in /var/www/certbot/.well-known/acme-challenge/
    #   - Let's Encrypt fetches http://yourdomain.com/.well-known/acme-challenge/<token>
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;  # Serve from certbot webroot
    }

    # Redirect everything else to HTTPS (301 = permanent redirect)
    location / {
        return 301 https://$host$request_uri;  # https:// + original host + path
    }
}

# ---- HTTPS Server (Port 443) — Main Server ----
server {
    listen 443 ssl;  # Listen on HTTPS with SSL
    http2 on;        # Enable HTTP/2 (faster, multiplexing)
    server_name localhost;

    # ---- SSL/TLS Configuration ----
    ssl_certificate     /etc/nginx/ssl/cert.pem;      # SSL cert (from generate-ssl.sh or Let's Encrypt)
    ssl_certificate_key /etc/nginx/ssl/key.pem;        # SSL private key

    # Modern SSL settings (A+ rating on SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;  # Only TLS 1.2 and 1.3 (secure, no old SSL)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;  # Strong ciphers
    ssl_prefer_server_ciphers off;  # Let client choose (better for HTTP/2)
    ssl_session_cache shared:SSL:10m;  # SSL session cache (10MB, for resumption)
    ssl_session_timeout 10m;  # Session timeout

    # ---- CDN-Ready Security Headers ----
    # These work with Cloudflare, AWS CloudFront, etc., and protect against XSS, clickjacking, etc.
    add_header X-Frame-Options "SAMEORIGIN" always;  # Prevent clickjacking (only same origin can iframe)
    add_header X-Content-Type-Options "nosniff" always;  # Prevent MIME sniffing
    add_header X-XSS-Protection "1; mode=block" always;  # Enable XSS filter (old browsers)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  # Referrer policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss: http://localhost:8000 http://api:8000;" always;  # CSP (restrict where resources can load from)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;  # HSTS (force HTTPS for 1 year)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;  # Disable sensitive APIs

    # Hide Nginx version (security through obscurity)
    server_tokens off;

    # ---- Internal-only endpoints: never exposed publicly ----
    # Prometheus scrapes api:8000/metrics directly on the internal network.
    location = /api/metrics {
        return 404;
    }

    # ---- API Endpoints (Load Balanced, Rate Limited) ----
    location /api/ {
        # Rate limiting: Use api_limit zone, burst 20, no delay
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy to api_backend upstream (load balanced)
        proxy_pass http://api_backend/;  # Trailing / = strip /api/ prefix (e.g., /api/chat → /chat)

        # Proxy headers
        proxy_http_version 1.1;  # HTTP/1.1 (for keepalive)
        proxy_set_header Connection "";  # For keepalive (empty = keepalive)
        proxy_set_header Host $host;  # Original Host
        proxy_set_header X-Real-IP $remote_addr;  # Client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Chain of IPs
        proxy_set_header X-Forwarded-Proto $scheme;  # http or https
        proxy_set_header X-Request-ID $request_id;  # Unique request ID

        # Timeouts (multi-agent chat can take a while)
        proxy_connect_timeout 60s;  # Connect to backend
        proxy_send_timeout 60s;     # Send request to backend
        proxy_read_timeout 300s;    # Read response from backend (5 min for LLM)

        # SSE chat streaming must not be buffered (send immediately)
        proxy_buffering off;
    }

    # ---- WebSocket Endpoints (for /ws/*) ----
    location /ws/ {
        proxy_pass http://api_backend/ws/;  # Proxy to API WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # WebSocket Upgrade header
        proxy_set_header Connection "upgrade";   # Connection: upgrade
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;  # 24h for long-lived WebSocket
    }

    # ---- Next.js Frontend (Main UI, Catch-All) ----
    location / {
        proxy_pass http://frontend_backend/;  # Proxy to Next.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js needs these for proper asset loading and HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # No buffering for SSE
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Streamlit Web UI (Legacy, at /streamlit/) ----
    location /streamlit/ {
        # No URI part: keep the /streamlit/ prefix (Streamlit runs with
        # --server.baseUrlPath=streamlit, so it expects it)
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /streamlit;  # Tell Streamlit its prefix

        # Streamlit WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # ---- Swagger Docs (API) ----
    location /docs {
        proxy_pass http://api_backend/docs;  # No trailing / = keep /docs
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger UI loads its schema from /openapi.json
    location = /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Health Check (No Rate Limiting) ----
    location /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
    }

    # ---- Block Common Attack Paths (Hidden Files) ----
    location ~ /\. {  # Regex: any path with /. (e.g., /.git, /.env)
        deny all;  # Deny access
        access_log off;  # Don't log
        log_not_found off;
    }
}

# 💡 LEARNER TIP: Nginx Upstreams and Docker DNS
#   - Upstream `api:8000` resolves via Docker DNS (127.0.0.11) to container IP
#   - `resolve` + `zone` + `resolver` = Dynamic re-resolution (survives container recreates)
#   - Without this, Nginx would cache DNS at startup and fail if api container restarts with new IP
#   Test: docker exec <nginx-container> nginx -T  (dump config)
#         curl -k https://localhost/api/health  (via Nginx)
#         curl http://localhost:80/api/health  (should redirect to https)
