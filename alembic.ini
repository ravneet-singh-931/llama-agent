# Alembic configuration.
#
# The `sqlalchemy.url` line is deliberately EMPTY. The database URL comes from
# the application's own settings (DATABASE_URL / DB_* env vars), resolved in
# migrations/env.py, so there is exactly one source of truth for where the
# database is and no way for the two to disagree.
#
# Usage:
#   alembic current              # what revision is the database on?
#   alembic upgrade head         # apply pending migrations
#   alembic revision -m "add x"  # write a new one (then fill in upgrade/downgrade)
#   alembic check                # does the DB match the models? (see docs)
#
# In an async app this runs through the sync `pg8000`/`psycopg2` style URL, or
# against SQLite directly; env.py handles the conversion.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Empty on purpose - see the note above. Do not fill this in.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
